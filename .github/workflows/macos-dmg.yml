# macOS DMG + Sparkle 更新包：云端签名 + 公证，仅手动触发。
#
# Secrets（已有）：
#   MACOS_CERTIFICATE_BASE64 / MACOS_CERTIFICATE_PASSWORD / MACOS_SIGNING_IDENTITY
#   APPSTORE_ISSUER_ID / APPSTORE_KEY_ID / APPSTORE_API_PRIVATE_KEY
#
# 新增 Secrets：
#   SPARKLE_PRIVATE_KEY  — EdDSA 私钥单行 base64（见 .sparkle/README.md）
#
# 产物（Artifact DunesMacOSRelease）：
#   DunesSetup-macOS-{version}.dmg   — 首次安装
#   DunesSetup-macOS-{version}.zip   — Sparkle 应用内更新
#   appcast.xml                      — 手动上传到服务器覆盖
name: macOS DMG (Developer ID)

on:
  workflow_dispatch:

jobs:
  build-sign-notarize:
    runs-on: macos-latest
    env:
      APP_NAME: dunes_app
      RELEASE_DIR: build/macos/Build/Products/Release
      UPDATE_BASE_URL: http://dtmgr.he-yue.com.cn:9583/dtpc/mac
      SPARKLE_VERSION: 2.7.1
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.3'
          channel: 'stable'

      # 与 iOS 流水线一致：关闭 SPM，避免插件链接差异；本 job 只打 macOS，不碰 ios/
      - name: Disable Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Install Flutter dependencies
        run: flutter pub get

      # gal 等插件要求 macOS ≥ 11.0（默认模板常为 10.15）
      - name: Force macOS Deployment Target 11.0
        run: |
          sed -i '' 's/MACOSX_DEPLOYMENT_TARGET = .*;/MACOSX_DEPLOYMENT_TARGET = 11.0;/g' \
            macos/Runner.xcodeproj/project.pbxproj
          if [ -f macos/Podfile ]; then
            sed -i '' "s/platform :osx, '.*'/platform :osx, '11.0'/g" macos/Podfile
          fi

      # Xcode 要求 Bundle ID 只能含 A-Z a-z 0-9 - . ；下划线会直接导致 BUILD FAILED
      - name: Sanitize macOS bundle identifier
        run: |
          python3 <<'PY'
          from pathlib import Path
          replacements = {
              Path("macos/Runner/Configs/AppInfo.xcconfig"): None,
              Path("macos/Runner.xcodeproj/project.pbxproj"): None,
          }
          old, new = "nova.dunes.dunes_app", "nova.dunes.dunes-app"
          for path in replacements:
              text = path.read_text(encoding="utf-8")
              updated = text.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding="utf-8")
                  print(f"replaced {old} -> {new} in {path}")
              else:
                  print(f"ok: {path} already uses hyphenated bundle id")
          PY

      # CI 无本机 Apple Development 证书时，先无签名构建，再用 Developer ID 重签
      - name: Disable Xcode automatic signing for CI build
        run: |
          sed -i '' \
            -e 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' \
            macos/Runner.xcodeproj/project.pbxproj
          {
            echo 'CODE_SIGN_IDENTITY='
            echo 'CODE_SIGNING_REQUIRED=NO'
            echo 'CODE_SIGNING_ALLOWED=NO'
          } >> macos/Runner/Configs/Release.xcconfig

      # 仓库内 Release.entitlements 已按 Developer ID / Sparkle 关闭沙箱；
      # 此处再写一遍，防止本地误改导致 CI 产物无法应用内更新。
      - name: Ensure non-sandbox entitlements for Developer ID
        run: |
          cat > macos/Runner/Release.entitlements <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          	<key>com.apple.security.app-sandbox</key>
          	<false/>
          	<key>com.apple.security.cs.allow-jit</key>
          	<true/>
          	<key>com.apple.security.cs.allow-unsigned-executable-memory</key>
          	<true/>
          	<key>com.apple.security.cs.disable-library-validation</key>
          	<true/>
          	<key>com.apple.security.network.client</key>
          	<true/>
          	<key>com.apple.security.network.server</key>
          	<true/>
          	<key>com.apple.security.files.user-selected.read-write</key>
          	<true/>
          	<key>com.apple.security.files.downloads.read-write</key>
          	<true/>
          </dict>
          </plist>
          EOF
          # 去掉 YAML/runner 可能带入的行首空格
          sed -i '' 's/^[[:space:]]*//' macos/Runner/Release.entitlements
          plutil -lint macos/Runner/Release.entitlements

      - name: Build macOS release
        run: flutter build macos --release

      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: actions-macos-ci
        run: |
          if [ -z "$MACOS_CERTIFICATE_BASE64" ]; then
            echo "::error::缺少 secret MACOS_CERTIFICATE_BASE64（Developer ID Application .p12，iOS 证书不能直接用）"
            exit 1
          fi
          CERTIFICATE_PATH="$RUNNER_TEMP/developer_id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/macos-signing.keychain-db"
          echo -n "$MACOS_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Codesign app (hardened runtime)
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          APP_PATH="$RELEASE_DIR/${APP_NAME}.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "App not found. Contents of $RELEASE_DIR:"
            ls -la "$RELEASE_DIR" || true
            exit 1
          fi
          if [ -z "$MACOS_SIGNING_IDENTITY" ]; then
            # 未配置时尝试自动从钥匙串取 Developer ID Application
            MACOS_SIGNING_IDENTITY=$(security find-identity -v -p codesigning | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.+)"/\1/')
          fi
          if [ -z "$MACOS_SIGNING_IDENTITY" ]; then
            echo "::error::找不到 Developer ID Application 签名身份"
            security find-identity -v -p codesigning
            exit 1
          fi
          echo "Signing with: $MACOS_SIGNING_IDENTITY"
          ENTITLEMENTS=macos/Runner/Release.entitlements
          SIGN_ID="$MACOS_SIGNING_IDENTITY"

          sign_item() {
            local target="$1"
            echo "codesign: $target"
            codesign --force --timestamp --options runtime --sign "$SIGN_ID" "$target"
          }

          # Sparkle 嵌套组件必须由内向外用 Developer ID 重签，否则公证 Invalid
          SPARKLE_FW="$APP_PATH/Contents/Frameworks/Sparkle.framework"
          if [ -d "$SPARKLE_FW" ]; then
            SPARKLE_VER="$SPARKLE_FW/Versions/Current"
            [ -d "$SPARKLE_VER" ] || SPARKLE_VER="$SPARKLE_FW/Versions/B"
            for xpc in "$SPARKLE_VER"/XPCServices/*.xpc; do
              [ -d "$xpc" ] && sign_item "$xpc"
            done
            [ -d "$SPARKLE_VER/Updater.app" ] && sign_item "$SPARKLE_VER/Updater.app"
            [ -f "$SPARKLE_VER/Autoupdate" ] && sign_item "$SPARKLE_VER/Autoupdate"
            sign_item "$SPARKLE_FW"
          fi

          # 其余 dylib / framework / helper：由内向外
          while IFS= read -r -d '' bin; do
            case "$bin" in
              */Sparkle.framework/*) continue ;;
            esac
            sign_item "$bin"
          done < <(find "$APP_PATH/Contents/Frameworks" -type f \( -name "*.dylib" -o -name "*.so" \) -print0 2>/dev/null)

          while IFS= read -r -d '' fw; do
            case "$fw" in
              */Sparkle.framework) continue ;;
              */Sparkle.framework/*) continue ;;
            esac
            sign_item "$fw"
          done < <(find "$APP_PATH/Contents/Frameworks" -type d -name "*.framework" -print0 2>/dev/null)

          while IFS= read -r -d '' bin; do
            sign_item "$bin"
          done < <(find "$APP_PATH/Contents/Helpers" -type f -perm /111 -print0 2>/dev/null)

          while IFS= read -r -d '' bin; do
            sign_item "$bin"
          done < <(find "$APP_PATH/Contents/MacOS" -type f -perm /111 -print0 2>/dev/null)

          codesign --force --timestamp --options runtime \
            --entitlements "$ENTITLEMENTS" \
            --sign "$SIGN_ID" \
            "$APP_PATH"

          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          # 抽查 Sparkle 嵌套签名，确认已是 Developer ID
          if [ -d "$SPARKLE_FW" ] && [ -f "$SPARKLE_VER/Autoupdate" ]; then
            echo "::group::Sparkle Autoupdate signature"
            codesign -dv --verbose=2 "$SPARKLE_VER/Autoupdate"
            echo "::endgroup::"
            codesign -dv --verbose=2 "$SPARKLE_VER/Autoupdate" 2>&1 | grep -q "Developer ID Application" \
              || { echo "::error::Sparkle Autoupdate 未签上 Developer ID"; exit 1; }
          fi
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          echo "SIGN_IDENTITY=$SIGN_ID" >> "$GITHUB_ENV"

      - name: Create DMG
        run: |
          VERSION_LINE=$(grep '^version:' pubspec.yaml | head -1 | sed 's/version: //')
          VERSION="${VERSION_LINE%%+*}"
          BUILD="${VERSION_LINE##*+}"
          if [ "$BUILD" = "$VERSION_LINE" ]; then BUILD=1; fi
          DMG_NAME="DunesSetup-macOS-${VERSION}.dmg"
          DMG_PATH="$RUNNER_TEMP/$DMG_NAME"
          STAGE="$RUNNER_TEMP/dmg-stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp -R "$APP_PATH" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "沙丘" -srcfolder "$STAGE" -ov -format UDZO "$DMG_PATH"
          codesign --force --timestamp --sign "$SIGN_IDENTITY" "$DMG_PATH" || true
          {
            echo "VERSION=$VERSION"
            echo "BUILD=$BUILD"
            echo "DMG_PATH=$DMG_PATH"
            echo "DMG_NAME=$DMG_NAME"
          } >> "$GITHUB_ENV"
          ls -lh "$DMG_PATH"

      - name: Notarize DMG (reuse App Store Connect API key)
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          if [ -z "$APPSTORE_ISSUER_ID" ] || [ -z "$APPSTORE_KEY_ID" ] || [ -z "$APPSTORE_API_PRIVATE_KEY" ]; then
            echo "::error::缺少 App Store Connect API secrets（可与 iOS TestFlight 共用）"
            exit 1
          fi
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APPSTORE_KEY_ID}.p8"
          # secret 可能是 PEM 原文，也可能是 base64；兼容两种
          if echo "$APPSTORE_API_PRIVATE_KEY" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$APPSTORE_API_PRIVATE_KEY" > "$KEY_PATH"
          else
            echo -n "$APPSTORE_API_PRIVATE_KEY" | base64 --decode -o "$KEY_PATH" 2>/dev/null \
              || printf '%s\n' "$APPSTORE_API_PRIVATE_KEY" > "$KEY_PATH"
          fi

          dump_notary_log() {
            local sid="$1"
            [ -n "$sid" ] || return 0
            echo "::group::Apple notarization log ($sid)"
            xcrun notarytool log "$sid" \
              --key "$KEY_PATH" \
              --key-id "$APPSTORE_KEY_ID" \
              --issuer "$APPSTORE_ISSUER_ID" || true
            echo "::endgroup::"
          }

          ACCEPTED=0
          for attempt in 1 2 3; do
            set +e
            SUBMIT_LOG=$(xcrun notarytool submit "$DMG_PATH" \
              --key "$KEY_PATH" \
              --key-id "$APPSTORE_KEY_ID" \
              --issuer "$APPSTORE_ISSUER_ID" \
              --wait \
              --timeout 30m 2>&1)
            RC=$?
            set -e
            echo "$SUBMIT_LOG"

            SUBMISSION_ID=$(echo "$SUBMIT_LOG" | sed -n 's/^[[:space:]]*id:[[:space:]]*//p' | head -1 | tr -d '[:space:]')

            if [ "$RC" -eq 0 ] && ! echo "$SUBMIT_LOG" | grep -q "status: Invalid"; then
              ACCEPTED=1
              break
            fi

            dump_notary_log "$SUBMISSION_ID"

            if [ "$attempt" = 3 ]; then
              echo "::error::公证失败（见上方 Apple notarization log）"
              exit 1
            fi
            echo "notarytool attempt $attempt failed; retrying..."
            sleep 20
          done

          if [ "$ACCEPTED" != 1 ]; then
            echo "::error::公证未通过"
            exit 1
          fi

          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"
          # Sparkle ZIP 内的 .app 也尽量 staple（公证票据覆盖 DMG 内 app）
          xcrun stapler staple "$APP_PATH" || true
          spctl --assess --type open --context context:primary-signature -v "$DMG_PATH" || true

      - name: Create Sparkle ZIP + appcast.xml
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::error::缺少 secret SPARKLE_PRIVATE_KEY（见 .sparkle/README.md）"
            exit 1
          fi

          ZIP_NAME="DunesSetup-macOS-${VERSION}.zip"
          ZIP_PATH="$RUNNER_TEMP/$ZIP_NAME"
          OUT_DIR="$RUNNER_TEMP/macos-release"
          mkdir -p "$OUT_DIR"
          rm -f "$ZIP_PATH"
          # Sparkle 需要保留 .app 包结构
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ZIP_PATH"
          ls -lh "$ZIP_PATH"

          # 下载 Sparkle 官方 sign_update
          SPARKLE_TGZ="$RUNNER_TEMP/Sparkle-${SPARKLE_VERSION}.tar.xz"
          curl -fsSL -o "$SPARKLE_TGZ" \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          mkdir -p "$RUNNER_TEMP/sparkle-tools"
          tar -xJf "$SPARKLE_TGZ" -C "$RUNNER_TEMP/sparkle-tools"
          SIGN_UPDATE=$(find "$RUNNER_TEMP/sparkle-tools" -type f -name sign_update | head -1)
          if [ -z "$SIGN_UPDATE" ] || [ ! -x "$SIGN_UPDATE" ]; then
            echo "::error::未找到 Sparkle sign_update"
            find "$RUNNER_TEMP/sparkle-tools" -maxdepth 3 -type f | head -50
            exit 1
          fi

          PRIV_KEY="$RUNNER_TEMP/sparkle_eddsa_priv.key"
          printf '%s' "$SPARKLE_PRIVATE_KEY" | tr -d '\r\n' > "$PRIV_KEY"
          # 兼容不同 Sparkle 版本的私钥参数
          set +e
          SIGN_OUT=$("$SIGN_UPDATE" "$ZIP_PATH" --ed-key-file "$PRIV_KEY" 2>&1)
          SIGN_RC=$?
          if [ $SIGN_RC -ne 0 ]; then
            SIGN_OUT=$("$SIGN_UPDATE" -f "$PRIV_KEY" "$ZIP_PATH" 2>&1)
            SIGN_RC=$?
          fi
          if [ $SIGN_RC -ne 0 ]; then
            SIGN_OUT=$("$SIGN_UPDATE" "$ZIP_PATH" -f "$PRIV_KEY" 2>&1)
            SIGN_RC=$?
          fi
          set -e
          if [ $SIGN_RC -ne 0 ]; then
            echo "::error::sign_update 失败: $SIGN_OUT"
            exit 1
          fi
          echo "sign_update: $SIGN_OUT"
          ED_SIG=$(echo "$SIGN_OUT" | sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p')
          LENGTH=$(echo "$SIGN_OUT" | sed -n 's/.*length="\([0-9]*\)".*/\1/p')
          if [ -z "$ED_SIG" ]; then
            # 部分版本只输出 signature 一行
            ED_SIG=$(echo "$SIGN_OUT" | tr ' ' '\n' | grep -E '^[A-Za-z0-9+/=]{40,}$' | head -1)
          fi
          if [ -z "$LENGTH" ]; then
            LENGTH=$(wc -c < "$ZIP_PATH" | tr -d ' ')
          fi
          if [ -z "$ED_SIG" ]; then
            echo "::error::解析 Sparkle 签名失败: $SIGN_OUT"
            exit 1
          fi

          PUB_DATE=$(date -u "+%a, %d %b %Y %H:%M:%S +0000")
          ZIP_URL="${UPDATE_BASE_URL}/${ZIP_NAME}"
          APPCAST_PATH="$OUT_DIR/appcast.xml"
          cat > "$APPCAST_PATH" <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle" xmlns:dc="http://purl.org/dc/elements/1.1/">
            <channel>
              <title>沙丘 macOS</title>
              <link>${UPDATE_BASE_URL}/appcast.xml</link>
              <description>沙丘 macOS 更新</description>
              <language>zh-CN</language>
              <item>
                <title>Version ${VERSION}</title>
                <sparkle:version>${BUILD}</sparkle:version>
                <sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>
                <pubDate>${PUB_DATE}</pubDate>
                <enclosure
                  url="${ZIP_URL}"
                  length="${LENGTH}"
                  type="application/octet-stream"
                  sparkle:edSignature="${ED_SIG}" />
              </item>
            </channel>
          </rss>
          EOF
          sed -i '' 's/^[[:space:]]*//' "$APPCAST_PATH"

          cp "$DMG_PATH" "$OUT_DIR/"
          cp "$ZIP_PATH" "$OUT_DIR/"
          {
            echo "发布说明"
            echo "1. 上传 ${ZIP_NAME} 到 ${UPDATE_BASE_URL}/"
            echo "2. 上传 ${DMG_NAME}（首次安装）到同一目录（可选）"
            echo "3. 用本目录 appcast.xml 覆盖服务器 appcast.xml"
            echo "4. 后台 API 仍配置更新公告；downloadUrl 可指向 DMG 作浏览器兜底"
            echo "ZIP=${ZIP_NAME}"
            echo "edSignature=${ED_SIG}"
            echo "length=${LENGTH}"
          } > "$OUT_DIR/UPLOAD.txt"

          echo "OUT_DIR=$OUT_DIR" >> "$GITHUB_ENV"
          cat "$APPCAST_PATH"
          cat "$OUT_DIR/UPLOAD.txt"

      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DunesMacOSRelease
          path: ${{ env.OUT_DIR }}
