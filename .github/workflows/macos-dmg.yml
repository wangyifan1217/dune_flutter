# macOS DMG：云端签名 + 公证，仅手动触发。
#
# 可与 Flutter 项目（new_dune_web/flutter）复用同一套 GitHub Secrets：
#   MACOS_CERTIFICATE_BASE64 / MACOS_CERTIFICATE_PASSWORD / MACOS_SIGNING_IDENTITY
#   APPSTORE_ISSUER_ID / APPSTORE_KEY_ID / APPSTORE_API_PRIVATE_KEY
#
# Apple Developer → Certificates → Developer ID Application → 导出 .p12
#   base64 -i DeveloperID.p12 | pbcopy  → 填入 MACOS_CERTIFICATE_BASE64
#   MACOS_SIGNING_IDENTITY 示例：Developer ID Application: Your Company (TEAMID)
name: macOS DMG (Developer ID)

on:
  workflow_dispatch:

jobs:
  build-sign-notarize:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon（M1/M2/M3…）
          - target: aarch64-apple-darwin
            artifact: NovaDesktop-macOS-arm64
          # Intel Mac
          - target: x86_64-apple-darwin
            artifact: NovaDesktop-macOS-x64
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      # Flutter 同款 secrets → Tauri 环境变量；Tauri 在 build 时自动 codesign + notarize
      - name: Build signed + notarized DMG
        env:
          APPLE_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPLE_API_KEY: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::error::缺少 secret MACOS_CERTIFICATE_BASE64（Developer ID Application .p12）"
            exit 1
          fi
          if [ -z "$APPLE_API_ISSUER" ] || [ -z "$APPLE_API_KEY" ] || [ -z "$APPSTORE_API_PRIVATE_KEY" ]; then
            echo "::error::缺少 App Store Connect API secrets（可与 Flutter iOS/macOS 流水线共用）"
            exit 1
          fi

          KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          if echo "$APPSTORE_API_PRIVATE_KEY" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$APPSTORE_API_PRIVATE_KEY" > "$KEY_PATH"
          else
            echo -n "$APPSTORE_API_PRIVATE_KEY" | base64 --decode -o "$KEY_PATH" 2>/dev/null \
              || printf '%s\n' "$APPSTORE_API_PRIVATE_KEY" > "$KEY_PATH"
          fi
          export APPLE_API_KEY_PATH="$KEY_PATH"

          npm run tauri build -- --target "${{ matrix.target }}" --bundles dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
