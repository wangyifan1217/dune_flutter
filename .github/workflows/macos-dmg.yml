# macOS DMG：云端签名 + 公证，仅手动触发。
#
# 证书导入步骤与 Flutter 项目（dune_flutter）的 macOS DMG 流水线保持一致，
# 可复用同一套 GitHub Secrets：
#   MACOS_CERTIFICATE_BASE64 / MACOS_CERTIFICATE_PASSWORD / MACOS_SIGNING_IDENTITY
#   APPSTORE_ISSUER_ID / APPSTORE_KEY_ID / APPSTORE_API_PRIVATE_KEY
#
# Apple Developer → Certificates → Developer ID Application → 导出 .p12
#   base64 -i DeveloperID.p12 | pbcopy  → 填入 MACOS_CERTIFICATE_BASE64
#   MACOS_SIGNING_IDENTITY 示例：Developer ID Application: Your Company (TEAMID)
name: macOS DMG (Developer ID)

on:
  workflow_dispatch:

jobs:
  build-sign-notarize:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            artifact: NovaDesktop-macOS-arm64
          - target: x86_64-apple-darwin
            artifact: NovaDesktop-macOS-x64
    runs-on: macos-latest
    env:
      KEYCHAIN_PASSWORD: actions-macos-ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      # 与 Flutter macos-dmg.yml 相同的钥匙串导入方式（不要交给 Tauri 再 import 一次）
      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE_BASE64" ]; then
            echo "::error::缺少 secret MACOS_CERTIFICATE_BASE64（Developer ID Application .p12，iOS 证书不能直接用）"
            exit 1
          fi
          CERTIFICATE_PATH="$RUNNER_TEMP/developer_id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/macos-signing.keychain-db"
          echo -n "$MACOS_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Resolve signing identity
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          if [ -z "$MACOS_SIGNING_IDENTITY" ]; then
            MACOS_SIGNING_IDENTITY=$(security find-identity -v -p codesigning | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.+)"/\1/')
          fi
          if [ -z "$MACOS_SIGNING_IDENTITY" ]; then
            echo "::error::找不到 Developer ID Application 签名身份"
            security find-identity -v -p codesigning
            exit 1
          fi
          echo "Signing with: $MACOS_SIGNING_IDENTITY"
          echo "APPLE_SIGNING_IDENTITY=$MACOS_SIGNING_IDENTITY" >> "$GITHUB_ENV"

      - name: Build signed + notarized DMG
        env:
          # 只用已导入钥匙串的身份；不要再传 APPLE_CERTIFICATE，避免 Tauri 二次 import 失败
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPLE_API_KEY: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          if [ -z "$APPLE_API_ISSUER" ] || [ -z "$APPLE_API_KEY" ] || [ -z "$APPSTORE_API_PRIVATE_KEY" ]; then
            echo "::error::缺少 App Store Connect API secrets（可与 Flutter iOS/macOS 流水线共用）"
            exit 1
          fi

          KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          if echo "$APPSTORE_API_PRIVATE_KEY" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$APPSTORE_API_PRIVATE_KEY" > "$KEY_PATH"
          else
            echo -n "$APPSTORE_API_PRIVATE_KEY" | base64 --decode -o "$KEY_PATH" 2>/dev/null \
              || printf '%s\n' "$APPSTORE_API_PRIVATE_KEY" > "$KEY_PATH"
          fi
          export APPLE_API_KEY_PATH="$KEY_PATH"

          npm run tauri build -- --target "${{ matrix.target }}" --bundles dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
