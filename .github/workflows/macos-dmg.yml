# macOS DMG：云端签名 + 公证，仅手动触发，不影响 iOS APP 流水线。
#
# 可复用（与 iOS TestFlight 相同）：
#   APPSTORE_ISSUER_ID / APPSTORE_KEY_ID / APPSTORE_API_PRIVATE_KEY
#
# 不能复用（必须新建 Developer ID Application 证书）：
#   MACOS_CERTIFICATE_BASE64 / MACOS_CERTIFICATE_PASSWORD / MACOS_SIGNING_IDENTITY
#
# Apple Developer → Certificates → Developer ID Application → 导出 .p12
#   base64 -i DeveloperID.p12 | pbcopy  → 填入 MACOS_CERTIFICATE_BASE64
#   MACOS_SIGNING_IDENTITY 示例：Developer ID Application: Your Company (TEAMID)
name: macOS DMG (Developer ID)

on:
  workflow_dispatch:

jobs:
  build-sign-notarize:
    runs-on: macos-latest
    env:
      APP_NAME: dunes_app
      RELEASE_DIR: build/macos/Build/Products/Release
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.3'
          channel: 'stable'

      # 与 iOS 流水线一致：关闭 SPM，避免插件链接差异；本 job 只打 macOS，不碰 ios/
      - name: Disable Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Install Flutter dependencies
        run: flutter pub get

      # gal 等插件要求 macOS ≥ 11.0（默认模板常为 10.15）
      - name: Force macOS Deployment Target 11.0
        run: |
          sed -i '' 's/MACOSX_DEPLOYMENT_TARGET = .*;/MACOSX_DEPLOYMENT_TARGET = 11.0;/g' \
            macos/Runner.xcodeproj/project.pbxproj
          if [ -f macos/Podfile ]; then
            sed -i '' "s/platform :osx, '.*'/platform :osx, '11.0'/g" macos/Podfile
          fi

      # CI 无本机 Apple Development 证书时，先无签名构建，再用 Developer ID 重签
      - name: Disable Xcode automatic signing for CI build
        run: |
          sed -i '' \
            -e 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' \
            macos/Runner.xcodeproj/project.pbxproj
          {
            echo 'CODE_SIGN_IDENTITY='
            echo 'CODE_SIGNING_REQUIRED=NO'
            echo 'CODE_SIGNING_ALLOWED=NO'
          } >> macos/Runner/Configs/Release.xcconfig

      # DMG 分发（非 Mac App Store）关闭 App Sandbox，避免网络/文件权限被沙箱拦住
      # 仅改 CI 工作区副本，不提交；不影响 iOS / 本地默认工程
      - name: Use non-sandbox entitlements for Developer ID
        run: |
          cat > macos/Runner/Release.entitlements <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          	<key>com.apple.security.app-sandbox</key>
          	<false/>
          	<key>com.apple.security.cs.allow-jit</key>
          	<true/>
          	<key>com.apple.security.cs.allow-unsigned-executable-memory</key>
          	<true/>
          	<key>com.apple.security.cs.disable-library-validation</key>
          	<true/>
          	<key>com.apple.security.network.client</key>
          	<true/>
          	<key>com.apple.security.network.server</key>
          	<true/>
          	<key>com.apple.security.files.user-selected.read-write</key>
          	<true/>
          </dict>
          </plist>
          EOF
          # 去掉 YAML/runner 可能带入的行首空格
          sed -i '' 's/^[[:space:]]*//' macos/Runner/Release.entitlements
          plutil -lint macos/Runner/Release.entitlements

      - name: Build macOS release
        run: flutter build macos --release

      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: actions-macos-ci
        run: |
          if [ -z "$MACOS_CERTIFICATE_BASE64" ]; then
            echo "::error::缺少 secret MACOS_CERTIFICATE_BASE64（Developer ID Application .p12，iOS 证书不能直接用）"
            exit 1
          fi
          CERTIFICATE_PATH="$RUNNER_TEMP/developer_id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/macos-signing.keychain-db"
          echo -n "$MACOS_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Codesign app (hardened runtime)
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          APP_PATH="$RELEASE_DIR/${APP_NAME}.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "App not found. Contents of $RELEASE_DIR:"
            ls -la "$RELEASE_DIR" || true
            exit 1
          fi
          if [ -z "$MACOS_SIGNING_IDENTITY" ]; then
            # 未配置时尝试自动从钥匙串取 Developer ID Application
            MACOS_SIGNING_IDENTITY=$(security find-identity -v -p codesigning | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.+)"/\1/')
          fi
          if [ -z "$MACOS_SIGNING_IDENTITY" ]; then
            echo "::error::找不到 Developer ID Application 签名身份"
            security find-identity -v -p codesigning
            exit 1
          fi
          echo "Signing with: $MACOS_SIGNING_IDENTITY"
          ENTITLEMENTS=macos/Runner/Release.entitlements

          # 先签嵌套二进制，再签 .app（避免 --deep）
          find "$APP_PATH/Contents/Frameworks" -type f \( -name "*.dylib" -o -name "*.so" -o -perm /111 \) 2>/dev/null | while read -r bin; do
            codesign --force --timestamp --options runtime --sign "$MACOS_SIGNING_IDENTITY" "$bin" || true
          done
          find "$APP_PATH/Contents/Frameworks" -type d -name "*.framework" 2>/dev/null | while read -r fw; do
            codesign --force --timestamp --options runtime --sign "$MACOS_SIGNING_IDENTITY" "$fw" || true
          done
          find "$APP_PATH/Contents/Helpers" -type f -perm /111 2>/dev/null | while read -r bin; do
            codesign --force --timestamp --options runtime --sign "$MACOS_SIGNING_IDENTITY" "$bin" || true
          done
          find "$APP_PATH/Contents/MacOS" -type f -perm /111 2>/dev/null | while read -r bin; do
            codesign --force --timestamp --options runtime --sign "$MACOS_SIGNING_IDENTITY" "$bin" || true
          done

          codesign --force --timestamp --options runtime \
            --entitlements "$ENTITLEMENTS" \
            --sign "$MACOS_SIGNING_IDENTITY" \
            "$APP_PATH"

          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          echo "SIGN_IDENTITY=$MACOS_SIGNING_IDENTITY" >> "$GITHUB_ENV"

      - name: Create DMG
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | head -1 | sed 's/version: //;s/+.*//')
          DMG_NAME="DunesSetup-macOS-${VERSION}.dmg"
          DMG_PATH="$RUNNER_TEMP/$DMG_NAME"
          STAGE="$RUNNER_TEMP/dmg-stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp -R "$APP_PATH" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "沙丘" -srcfolder "$STAGE" -ov -format UDZO "$DMG_PATH"
          codesign --force --timestamp --sign "$SIGN_IDENTITY" "$DMG_PATH" || true
          echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_ENV"
          echo "DMG_NAME=$DMG_NAME" >> "$GITHUB_ENV"
          ls -lh "$DMG_PATH"

      - name: Notarize DMG (reuse App Store Connect API key)
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          if [ -z "$APPSTORE_ISSUER_ID" ] || [ -z "$APPSTORE_KEY_ID" ] || [ -z "$APPSTORE_API_PRIVATE_KEY" ]; then
            echo "::error::缺少 App Store Connect API secrets（可与 iOS TestFlight 共用）"
            exit 1
          fi
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APPSTORE_KEY_ID}.p8"
          # secret 可能是 PEM 原文，也可能是 base64；兼容两种
          if echo "$APPSTORE_API_PRIVATE_KEY" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$APPSTORE_API_PRIVATE_KEY" > "$KEY_PATH"
          else
            echo -n "$APPSTORE_API_PRIVATE_KEY" | base64 --decode -o "$KEY_PATH" 2>/dev/null \
              || printf '%s\n' "$APPSTORE_API_PRIVATE_KEY" > "$KEY_PATH"
          fi

          for attempt in 1 2 3; do
            if xcrun notarytool submit "$DMG_PATH" \
              --key "$KEY_PATH" \
              --key-id "$APPSTORE_KEY_ID" \
              --issuer "$APPSTORE_ISSUER_ID" \
              --wait \
              --timeout 30m; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::公证失败"
              exit 1
            fi
            echo "notarytool attempt $attempt failed; retrying..."
            sleep 20
          done

          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"
          spctl --assess --type open --context context:primary-signature -v "$DMG_PATH" || true

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: DunesMacOSDmg
          path: ${{ env.DMG_PATH }}
