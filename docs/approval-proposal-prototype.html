<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>审批与提案 · 交互原型</title>
<style>
:root{--p:#5943bd;--dark:#282041;--muted:#817b91;--line:#e9e6f0;--bg:#f6f5fa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--dark);font:14px/1.5 system-ui,'Microsoft YaHei',sans-serif}button,input{font:inherit}button{cursor:pointer}header{height:68px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 6%;gap:18px;position:sticky;top:0;z-index:2}.logo{background:var(--p);color:white;border-radius:10px;padding:8px 11px;font-weight:800}header b{font-size:16px}header span{color:var(--muted);font-size:12px}.shell{max-width:1280px;margin:32px auto;padding:0 24px}.intro{display:flex;justify-content:space-between;gap:16px;align-items:end;margin-bottom:24px}h1,h2,h3,p{margin:0}h1{font-size:28px;letter-spacing:-1px}.sub{color:var(--muted);margin-top:5px}.badge{font-size:12px;padding:5px 10px;border-radius:20px;background:#eeeafb;color:var(--p);font-weight:700;white-space:nowrap}.layout{display:grid;grid-template-columns:205px 1fr;gap:20px}.side,.panel{background:white;border:1px solid var(--line);border-radius:16px;box-shadow:0 5px 24px #30205708}.side{padding:12px;height:max-content}.side small{display:block;padding:12px;color:#a6a0b1;font-weight:700}.nav{display:block;text-align:left;border:0;width:100%;border-radius:9px;background:none;padding:11px 12px;color:#6e687b}.nav.active{background:#f0edfc;color:var(--p);font-weight:700}.panel{padding:26px;min-height:550px}.panelhead{display:flex;justify-content:space-between;align-items:start;gap:15px;margin-bottom:23px}.panelhead h2{font-size:20px}.panelhead p,.hint{color:var(--muted);font-size:13px;margin-top:5px}.btn{border:1px solid #ddd7ed;background:white;color:#51486b;border-radius:9px;padding:9px 15px;font-weight:650}.primary{background:var(--p);border-color:var(--p);color:white}.btn:disabled{opacity:.45}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{border:1px solid var(--line);border-radius:13px;padding:18px;background:#fff}.card:hover{border-color:#c8bdf4}.cardtop,.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.icon{width:39px;height:39px;border-radius:11px;background:#efebfc;color:var(--p);display:grid;place-items:center;font-size:20px}.card h3{font-size:15px;margin:14px 0 4px}.card p{color:var(--muted);font-size:12px}.tag{background:#f2effb;color:#6552b8;border-radius:7px;font-size:11px;padding:4px 8px}.switch{appearance:none;width:42px;height:24px;border-radius:20px;background:#d9d6df;position:relative;cursor:pointer;vertical-align:middle}.switch:checked{background:var(--p)}.switch:after{content:'';position:absolute;width:18px;height:18px;top:3px;left:3px;border-radius:50%;background:white;transition:.2s}.switch:checked:after{left:21px}.setting{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:18px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px}.setting strong{display:block}.setting p{font-size:12px;color:var(--muted);margin-top:4px}.table{border:1px solid var(--line);border-radius:12px;overflow:hidden}.tr{display:grid;grid-template-columns:2.5fr 1fr 1fr 1fr .6fr;gap:12px;align-items:center;padding:16px;border-bottom:1px solid var(--line)}.tr:last-child{border:0}.tr.head{background:#faf9fc;color:var(--muted);font-size:12px;padding-top:11px;padding-bottom:11px}.link{border:0;background:none;color:var(--p);padding:0;text-align:left;font-weight:700}.status{color:#2b956c;background:#e7f7ee;padding:4px 8px;border-radius:6px;font-size:12px;width:max-content}.detailhead{background:#f7f5fd;border:1px solid #e4def8;border-radius:13px;padding:20px;margin-bottom:16px}.detailhead h2{font-size:20px;margin:8px 0}.twocol{display:grid;grid-template-columns:240px 1fr;gap:14px}.summary{background:#f1f3fb;border-color:#dce2f2;min-height:270px;display:flex;flex-direction:column}.summary .big{font-size:30px;font-weight:800;margin:12px 0 3px}.owner{margin-top:auto;border-top:1px solid #dce0ed;padding-top:12px}.owner strong{display:block;font-size:15px;margin-top:3px}.owner small{color:var(--muted)}.approvalrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}.approvalrow:last-child{border:0}.back{margin-bottom:18px}.modal{position:fixed;inset:0;background:#1b153b80;display:none;place-items:center;padding:18px;z-index:5}.modal.open{display:grid}.dialog{background:white;width:min(540px,100%);border-radius:18px;padding:24px;box-shadow:0 20px 80px #160e3c55}.dialog h2{font-size:20px}.search{width:100%;border:1px solid var(--line);padding:11px;border-radius:9px;margin:15px 0}.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{border:0;background:#f5f3fa;border-radius:8px;padding:8px 13px;color:#6f687d}.tabs button.active{background:#eee9ff;color:var(--p);font-weight:700}.choice{width:100%;text-align:left;background:white;border:1px solid var(--line);border-radius:10px;padding:13px;margin:5px 0;display:flex;justify-content:space-between;align-items:center}.choice.selected{border-color:var(--p);background:#f8f6ff}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.formlabel{display:block;font-size:12px;color:var(--muted);margin:17px 0 6px}.field{padding:12px;border:1px solid var(--line);border-radius:9px;background:#faf9fc}.notice{background:#f6f3ff;color:#6553a6;border-radius:9px;padding:12px;font-size:12px;margin-top:15px}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#30264b;color:white;padding:10px 18px;border-radius:9px;display:none;z-index:9}@media(max-width:700px){header{padding:0 18px}.shell{padding:0 12px;margin:18px auto}.intro{align-items:start;flex-direction:column}.layout{display:block}.side{display:flex;overflow:auto;margin-bottom:12px;padding:5px}.side small{display:none}.nav{white-space:nowrap;width:auto}.panel{padding:17px}.grid,.twocol{grid-template-columns:1fr}.summary{min-height:180px}.tr{grid-template-columns:2fr 1fr 1fr}.tr>*:nth-child(3),.tr>*:nth-child(4){display:none}}
</style></head><body><header><div class="logo">沙丘 X</div><b>审批与提案</b><span>交互原型 · 示例数据</span></header><main class="shell"><div class="intro"><div><h1>让审批与提案，彼此关联</h1><p class="sub">从审批发起，到提案回查，完整体验一次关联流程。</p></div><span class="badge">静态演示 · 不会提交真实数据</span></div><div class="layout"><aside class="side"><small>工作台</small><button class="nav active" data-page="start">▦　发起审批</button><button class="nav" data-page="proposals">▤　销售 / 采购提案</button><button class="nav" data-page="approvals">✓　我发起的审批</button><small>管理配置</small><button class="nav" data-page="settings">⚙　审批模板配置</button></aside><section class="panel" id="view"></section></div></main><div class="modal" id="modal"><div class="dialog" id="dialog"></div></div><div class="toast" id="toast"></div>
<script>
const proposals=[{id:1,title:'云南红河非油券业务提案',kind:'销售',code:'XS-2026-0086',owner:'许正阳',count:2},{id:2,title:'华东渠道权益采购提案',kind:'采购',code:'CG-2026-0021',owner:'李明',count:1},{id:3,title:'企业客户年度合作方案',kind:'销售',code:'XS-2026-0078',owner:'王晓',count:0}];
let templates=[{name:'合同用印审批',enabled:true,icon:'▤'},{name:'预付款审批',enabled:true,icon:'¥'},{name:'费用报销审批',enabled:false,icon:'◈'},{name:'采购申请审批',enabled:false,icon:'□'}];let approvals=[{name:'合同用印审批 · 云南红河非油券业务提案',proposal:1,status:'审批中',who:'许正阳'},{name:'预付款审批 · 云南红河非油券业务提案',proposal:1,status:'已通过',who:'许正阳'},{name:'采购申请审批 · 华东渠道权益采购提案',proposal:2,status:'审批中',who:'李明'}];let page='start', currentTemplate=null,selected=null,filter='全部',query='';
const view=document.querySelector('#view'),modal=document.querySelector('#modal'),dialog=document.querySelector('#dialog');function nav(p){page=p;document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.page===p));render()}document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>nav(n.dataset.page));function toast(t){let e=document.querySelector('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2300)}function closeModal(){modal.classList.remove('open')}modal.onclick=e=>{if(e.target===modal)closeModal()};function showModal(html){dialog.innerHTML=html;modal.classList.add('open')}
function render(){if(page==='start'){view.innerHTML=`<div class="panelhead"><div><h2>发起审批</h2><p>选择审批类型，开启提案关联的审批会先选择提案。</p></div></div><div class="grid">${templates.map((t,i)=>`<div class="card"><div class="cardtop"><div class="icon">${t.icon}</div>${t.enabled?'<span class="tag">需关联提案</span>':''}</div><h3>${t.name}</h3><p>${t.enabled?'选择相关提案后填写并提交':'直接填写审批内容'}</p><div style="margin-top:18px"><button class="btn" onclick="start(${i})">发起审批 →</button></div></div>`).join('')}</div>`}else if(page==='settings'){view.innerHTML=`<div class="panelhead"><div><h2>审批模板配置</h2><p>为每种审批单独设置是否需要关联提案。</p></div><span class="badge">模板设置</span></div>${templates.map((t,i)=>`<div class="setting"><div><strong>${t.name}</strong><p>发起时选择已完成的销售或采购提案</p></div><label><input class="switch" type="checkbox" ${t.enabled?'checked':''} onchange="templates[${i}].enabled=this.checked;toast('配置已更新')" aria-label="${t.name}关联提案开关"></label></div>`).join('')}<div class="notice">开启后，发起人先从自己有权关联的提案中选择；关闭后按普通审批流程填写。</div>`}else if(page==='proposals'){view.innerHTML=`<div class="panelhead"><div><h2>销售 / 采购提案</h2><p>查看提案状态和与它关联的审批数量。</p></div></div><div class="table"><div class="tr head"><span>提案名称</span><span>类型</span><span>责任人</span><span>状态</span><span>关联审批</span></div>${proposals.map(p=>`<div class="tr"><button class="link" onclick="proposalDetail(${p.id})">${p.title}<br><small style="color:#aaa;font-weight:400">${p.code}</small></button><span>${p.kind}提案</span><span>${p.owner}</span><span class="status">已完成</span><button class="link" onclick="proposalDetail(${p.id})">${p.count} 个 →</button></div>`).join('')}</div>`}else if(page==='approvals'){view.innerHTML=`<div class="panelhead"><div><h2>我发起的审批</h2><p>审批名称包含关联的提案名称，点击可查看详情。</p></div></div><div class="table">${approvals.map((a,i)=>`<div class="approvalrow" style="padding:16px"><div><button class="link" onclick="approvalDetail(${i})">${a.name}</button><p class="hint">发起人 ${a.who} · ${a.status}</p></div><button class="btn" onclick="approvalDetail(${i})">查看 →</button></div>`).join('')}</div>`}}
function start(i){currentTemplate=templates[i];selected=null;filter='全部';query='';if(currentTemplate.enabled)picker();else form()}
function picker(){let rows=proposals.filter(p=>(filter==='全部'||p.kind===filter)&&p.title.includes(query));showModal(`<div class="row"><div><h2>选择关联提案</h2><p class="hint">${currentTemplate.name} · 选择你有权关联的已完成提案</p></div><button class="btn" onclick="closeModal()">✕</button></div><input class="search" placeholder="搜索提案名称" value="${query}" oninput="query=this.value; updateChoices()"><div class="tabs">${['全部','销售','采购'].map(x=>`<button class="${filter===x?'active':''}" onclick="filter='${x}';picker()">${x==='全部'?'全部':x+'提案'}</button>`).join('')}</div><div id="choices">${choiceRows(rows)}</div><div class="actions"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" ${selected?'':'disabled'} onclick="form()">确认选择</button></div>`)}function choiceRows(rows){return rows.length?rows.map(p=>`<button class="choice ${selected===p.id?'selected':''}" onclick="selected=${p.id};picker()"><span><strong>${p.title}</strong><br><small style="color:#999">${p.code} · ${p.kind}提案 · 责任人 ${p.owner}</small></span><span>${selected===p.id?'●':'○'}</span></button>`).join(''):'<p class="hint">没有找到相关提案</p>'}function updateChoices(){document.querySelector('#choices').innerHTML=choiceRows(proposals.filter(p=>(filter==='全部'||p.kind===filter)&&p.title.includes(query)))}
function form(){let p=proposals.find(x=>x.id===selected);closeModal();page='form';view.innerHTML=`<button class="btn back" onclick="nav('start')">← 返回审批</button><div class="panelhead"><div><h2>${currentTemplate.name}</h2><p>填写审批信息并提交</p></div><span class="badge">新建审批</span></div>${p?`<label class="formlabel">关联提案 *</label><div class="field row"><span><strong>${p.title}</strong><br><small class="hint">${p.kind}提案 · ${p.code}</small></span><button class="link" onclick="picker()">更换</button></div>`:''}<label class="formlabel">审批名称</label><div class="field">${currentTemplate.name}${p?' · '+p.title:''}</div><label class="formlabel">审批说明</label><input class="search" placeholder="填写本次审批说明"><div class="notice">提交后，审批和提案将互相显示关联记录。</div><div class="actions"><button class="btn" onclick="nav('start')">取消</button><button class="btn primary" onclick="submitDemo()">提交审批</button></div>`}
function submitDemo(){let p=proposals.find(x=>x.id===selected);approvals.unshift({name:currentTemplate.name+(p?' · '+p.title:''),proposal:p?.id,status:'审批中',who:'当前用户'});if(p)p.count++;toast('演示提交成功');nav('approvals')}
function proposalDetail(id){let p=proposals.find(x=>x.id===id),list=approvals.map((a,i)=>({...a,i})).filter(a=>a.proposal===id);view.innerHTML=`<button class="btn back" onclick="nav('proposals')">← 返回提案列表</button><div class="detailhead"><span class="tag">${p.kind}提案 · 已完成</span><h2>${p.title}</h2><span class="hint">${p.code}　·　提案详情</span></div><div class="twocol"><div class="card summary"><span class="tag" style="width:max-content">年化规模</span><div class="big">37.2 <small style="font-size:13px">万</small></div><span class="hint">月均 3.1 万 · ÷12</span><div class="owner"><small>责任人</small><strong>◉　${p.owner}</strong><small>市场部负责人二</small></div></div><div class="card"><div class="row"><div><h3 style="margin:0">关联业务审批</h3><p>当前用户可查看的审批 · ${list.length} 个</p></div><span class="tag">双向关联</span></div>${list.length?list.map(a=>`<div class="approvalrow"><div><button class="link" onclick="approvalDetail(${a.i})">${a.name}</button><p>${a.who} · ${a.status}</p></div><span>›</span></div>`).join(''):'<p style="padding:28px 0">暂无关联审批</p>'}</div></div>`}
function approvalDetail(i){let a=approvals[i],p=proposals.find(x=>x.id===a.proposal);view.innerHTML=`<button class="btn back" onclick="nav('approvals')">← 返回审批列表</button><div class="detailhead"><span class="tag">${a.status}</span><h2>${a.name}</h2><p class="hint">发起人 ${a.who} · 审批详情</p></div><div class="card"><h3 style="margin:0 0 12px">关联提案</h3>${p?`<div class="approvalrow"><div><button class="link" onclick="proposalDetail(${p.id})">${p.title}</button><p>${p.kind}提案 · ${p.code} · 责任人 ${p.owner}</p></div><button class="btn" onclick="proposalDetail(${p.id})">查看提案 →</button></div>`:'<p>此审批未关联提案</p>'}</div>`}render();
</script></body></html>
