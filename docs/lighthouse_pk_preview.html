<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>灯塔 · PK 对比</title>
<style>
  :root {
    --page: #f5f3f8;
    --ink: #2a2633;
    --ink2: #4a4558;
    --mute: #8c8798;
    --line: #e4dcf4;
    --deep: #5a458f;
    --primary: #7b5cd8;
    --lavender: #f0ecf6;
    --a: #7b5cd8;
    --b: #3f78e0;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #ece8f2;
    color: var(--ink);
    font-family: "Geist", "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }
  .frame {
    width: min(390px, 100%);
    height: 100%;
    margin: 0 auto;
    background: var(--page);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }
  .top {
    height: 48px;
    display: grid;
    grid-template-columns: 72px 1fr 72px;
    align-items: center;
    padding: 0 8px;
    flex: none;
  }
  .top button {
    border: 0; background: transparent; cursor: pointer;
    color: var(--deep); font-size: 12px; font-weight: 600;
    display: inline-flex; align-items: center; gap: 0; padding: 0;
  }
  .top .title { text-align: center; }
  .top .title b { display: block; font-size: 16px; font-weight: 800; letter-spacing: .3px; color: var(--ink); }
  .top .title span { display: block; font-size: 10px; color: var(--mute); margin-top: 1px; }
  .top .end { justify-content: flex-end; }
  .head { padding: 2px 12px 0; flex: none; }
  .pair {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 10px;
    position: relative;
    min-width: 0;
  }
  .card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 14px;
    min-height: 92px;
    min-width: 0;
    padding: 8px 8px 7px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 4px 12px rgba(90, 69, 143, .08);
  }
  .card.a { border-color: #d4c6f2; }
  .card.b { border-color: #c9d7f6; }
  .card.empty {
    display: grid; place-items: center;
    color: var(--deep); font-size: 12px; font-weight: 650; cursor: pointer;
    width: 100%;
  }
  .badge {
    width: 18px; height: 18px; border-radius: 5px;
    color: #fff; font-size: 10px; font-weight: 700;
    display: grid; place-items: center;
    font-family: ui-monospace, "SF Mono", "Cascadia Mono", monospace;
  }
  .card h3 {
    margin: 5px 0 0;
    font-size: 12px;
    line-height: 1.35;
    font-weight: 700;
    min-height: 32px;
  }
  .meta {
    margin-top: 4px;
    display: flex; justify-content: space-between; align-items: baseline; gap: 4px;
    min-width: 0;
    font-size: 10px; color: var(--mute);
  }
  .meta span { min-width: 0; }
  .meta b {
    font-family: ui-monospace, "SF Mono", "Cascadia Mono", monospace;
    font-size: 11px; font-weight: 700;
    flex: none;
  }
  .card.a .meta b { color: var(--a); }
  .card.b .meta b { color: var(--b); }
  .ops { display: flex; gap: 8px; margin-top: 6px; }
  .ops button {
    border: 0; background: transparent; padding: 0; cursor: pointer;
    font-size: 10.5px; color: var(--deep); font-weight: 600;
  }
  .corner {
    position: absolute; right: 0; bottom: 0;
    width: 12px; height: 12px;
    border-radius: 10px 0 0 0;
  }
  .card.a .corner { background: var(--a); }
  .card.b .corner { background: var(--b); }
  .vs {
    position: absolute; left: 50%; top: 38px;
    transform: translate(-50%, 0);
    width: 32px; height: 32px; border-radius: 10px;
    background: #fff; border: 1px solid #e2d8f0;
    box-shadow: 0 4px 10px rgba(90, 69, 143, .12);
    display: grid; place-items: center;
    font-family: ui-monospace, "SF Mono", "Cascadia Mono", monospace;
    font-size: 11px; font-weight: 800; color: var(--deep); letter-spacing: -.4px;
    z-index: 1;
  }
  .score {
    margin-top: 10px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 8px 12px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .score .n {
    font-family: ui-monospace, "SF Mono", "Cascadia Mono", monospace;
    font-size: 16px; font-weight: 800;
  }
  .score .n.a { color: var(--a); }
  .score .n.b { color: var(--b); }
  .score .colon { color: #b5aad5; font-weight: 700; font-size: 13px; }
  .pill {
    height: 18px; padding: 0 7px; border-radius: 9px;
    background: var(--lavender); color: var(--deep);
    font-size: 10px; font-weight: 700;
    display: inline-flex; align-items: center;
  }
  .cats {
    display: flex; gap: 6px; overflow: auto;
    padding: 10px 14px 8px;
    scrollbar-width: none; flex: none;
  }
  .cats::-webkit-scrollbar { display: none; }
  .cats button {
    border: 1px solid transparent; background: #fff; color: var(--ink2);
    height: 26px; padding: 0 10px; border-radius: 8px;
    font-size: 11.5px; font-weight: 600; white-space: nowrap; cursor: pointer;
  }
  .cats button.on { background: var(--deep); color: #fff; border-color: var(--deep); }
  .scroll { flex: 1; min-width: 0; overflow-x: hidden; overflow-y: auto; padding: 0 12px 20px; }
  .sec { margin-top: 4px; min-width: 0; }
  .row > * { min-width: 0; }
  .sec h2 {
    margin: 10px 0 6px;
    font-size: 12px; font-weight: 700; color: var(--ink2); letter-spacing: .2px;
  }
  .row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 68px minmax(0, 1fr);
    gap: 4px;
    align-items: center;
    width: 100%;
    min-width: 0;
    min-height: 26px;
    padding: 4px 0;
    border-bottom: 1px solid rgba(228, 220, 244, .7);
  }
  .row .v {
    font-family: ui-monospace, "SF Mono", "Cascadia Mono", monospace;
    font-size: 12px; font-weight: 650; color: var(--mute);
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .row.main .v { font-size: 13px; }
  .row .v.r { text-align: right; }
  .row .v.wa { color: var(--a); font-weight: 800; }
  .row .v.wb { color: var(--b); font-weight: 800; }
  .mid { text-align: center; }
  .mid b { display: block; font-size: 11px; font-weight: 700; }
  .mid i { display: block; font-style: normal; font-size: 9px; color: var(--mute); margin-top: 1px; }
  .note {
    grid-column: 1 / -1;
    font-size: 10px; color: var(--mute); text-align: center; margin-top: -2px;
  }
  .fine { margin: 8px 0 0; font-size: 10px; line-height: 1.45; color: var(--mute); }
  .sheet-mask {
    position: absolute; inset: 0; background: rgba(42, 38, 51, .28);
    display: none; align-items: flex-end; z-index: 4;
  }
  .sheet-mask.show { display: flex; }
  .sheet {
    width: 100%; background: #fff; border-radius: 14px 14px 0 0;
    padding: 12px 14px 18px;
  }
  .sheet h4 { margin: 2px 0 8px; font-size: 13px; }
  .opt {
    width: 100%; text-align: left; border: 1px solid var(--line);
    background: #fff; border-radius: 10px; padding: 8px 10px; margin-bottom: 6px; cursor: pointer;
  }
  .opt b { display: block; font-size: 12.5px; }
  .opt span { color: var(--mute); font-size: 10.5px; }
  .toast {
    position: absolute; left: 50%; top: 56px; transform: translateX(-50%);
    background: rgba(42, 38, 51, .9); color: #fff;
    font-size: 12px; padding: 6px 10px; border-radius: 8px;
    opacity: 0; pointer-events: none;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="frame">
  <div class="top">
    <button id="back">‹ 擂台</button>
    <div class="title"><b>PK 对比</b><span id="sub">本月 · 产品</span></div>
    <button class="end" id="copy">复制</button>
  </div>
  <div class="head">
    <div class="pair" id="pair"></div>
    <div class="score" id="score"></div>
  </div>
  <div class="cats" id="cats"></div>
  <div class="scroll" id="scroll"></div>
  <div class="sheet-mask" id="mask"><div class="sheet"><h4>更换对比对象</h4><div id="options"></div></div></div>
  <div class="toast" id="toast"></div>
</div>
<script>
const GROUPS = [
  { id: "scale", title: "规模", keys: ["sales", "verifiedSales", "gmv"] },
  { id: "profit", title: "利润", keys: ["profit", "grossMargin", "revenue"] },
  { id: "cost", title: "成本", keys: ["costTotal"] },
  { id: "cash", title: "现金流", keys: ["prepaid"] },
];
const METRICS = {
  sales: { label: "销售额" },
  verifiedSales: { label: "核销额" },
  gmv: { label: "GMV" },
  profit: { label: "利润" },
  grossMargin: { label: "毛利率", isRate: true },
  revenue: { label: "收入" },
  costTotal: { label: "成本合计", lowerWins: true },
  prepaid: { label: "净现金流" },
};
const pool = [
  { id: "a", letter: "A", name: "中石油现金券 · 北京中抚", group: "能源", short: "中石油券",
    metrics: { sales: 128000000, verifiedSales: 86000000, gmv: 152000000, profit: 4200000, grossMargin: 18.6, revenue: 22600000, costTotal: 18400000, prepaid: 3100000 } },
  { id: "b", letter: "B", name: "江苏泰康人寿预付卡", group: "保险", short: "泰康预付卡",
    metrics: { sales: 86000000, verifiedSales: 54000000, gmv: 91000000, profit: 1800000, grossMargin: 12.4, revenue: 14500000, costTotal: 12700000, prepaid: -400000 } },
  { id: "c", letter: "C", name: "中石化加油券", group: "能源", short: "中石化券",
    metrics: { sales: 64000000, verifiedSales: 41000000, gmv: 72000000, profit: 900000, grossMargin: 9.8, revenue: 9200000, costTotal: 8300000, prepaid: 1200000 } },
];
let slots = ["a", "b"];
let swapSide = 0;

function money(v) {
  if (v == null) return "—";
  const sign = v < 0 ? "-" : "";
  const a = Math.abs(v);
  if (a >= 1e8) return sign + (a / 1e8).toFixed(2) + "亿";
  const w = a / 1e4;
  if (w >= 1000) return sign + (a / 1e8).toFixed(2) + "亿";
  return sign + (w >= 100 ? w.toFixed(0) : w.toFixed(1)).replace(/\.0$/, "") + "万";
}
function fmt(key, v) {
  if (v == null) return "—";
  return METRICS[key].isRate ? v.toFixed(1) + "%" : money(v);
}
function find(id) { return pool.find(p => p.id === id); }
function sideClass(i) { return i === 0 ? "a" : "b"; }
function toast(t) {
  const el = document.getElementById("toast");
  el.textContent = t;
  el.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove("show"), 1400);
}
function winner(key, L, R) {
  if (L == null || R == null || L === R) return -1;
  return (METRICS[key].lowerWins ? L < R : L > R) ? 0 : 1;
}
function note(key, L, R) {
  const w = winner(key, L, R);
  if (w < 0) return "打平";
  const who = w === 0 ? "A" : "B";
  if (METRICS[key].isRate) return who + " 高 " + Math.abs(L - R).toFixed(1) + " 个点";
  return who + (METRICS[key].lowerWins ? " 低 " : " 多 ") + money(Math.abs(L - R));
}
function tally() {
  const wins = [0, 0];
  if (!slots[0] || !slots[1]) return wins;
  const L = find(slots[0]).metrics, R = find(slots[1]).metrics;
  for (const key of Object.keys(METRICS)) {
    const w = winner(key, L[key], R[key]);
    if (w >= 0) wins[w]++;
  }
  return wins;
}

function renderPair() {
  document.getElementById("pair").innerHTML = slots.map((id, side) => {
    if (!id) return `<button class="card empty" data-act="pick" data-side="${side}">＋ 添加</button>`;
    const p = find(id);
    const wins = tally()[side];
    return `<div class="card ${sideClass(side)}">
      <div class="badge" style="background:${side === 0 ? "var(--a)" : "var(--b)"}">${side === 0 ? "A" : "B"}</div>
      <h3>${p.name}</h3>
      <div class="meta"><span>${wins} 项胜出</span><b>${money(p.metrics.sales)}</b></div>
      <div class="ops">
        <button data-act="pin" data-side="${side}">钉在左侧</button>
        <button data-act="pick" data-side="${side}">更换</button>
        <button data-act="close" data-side="${side}">移除</button>
      </div>
      <i class="corner"></i>
    </div>`;
  }).join("") + `<div class="vs">VS</div>`;
  const wins = tally();
  const lead = wins[0] === wins[1] ? "打平" : (wins[0] > wins[1] ? "A 领先" : "B 领先");
  document.getElementById("score").innerHTML =
    `<span class="n a">${wins[0]}</span><span class="colon">:</span><span class="n b">${wins[1]}</span><span class="pill">${lead}</span>`;
}

function renderBody() {
  document.getElementById("cats").innerHTML = GROUPS.map((g, i) =>
    `<button data-act="jump" data-id="${g.id}" class="${i === 0 ? "on" : ""}">${g.title}</button>`
  ).join("");
  const L = slots[0] ? find(slots[0]).metrics : null;
  const R = slots[1] ? find(slots[1]).metrics : null;
  document.getElementById("scroll").innerHTML = GROUPS.map(g => `
    <section class="sec" id="sec-${g.id}">
      <h2>${g.title}</h2>
      ${g.keys.map((key, i) => {
        const lv = L ? L[key] : null, rv = R ? R[key] : null;
        const w = winner(key, lv, rv);
        return `<div class="row ${i === 0 ? "main" : ""}">
          <div class="v ${w === 0 ? "wa" : ""}">${fmt(key, lv)}</div>
          <div class="mid"><b>${METRICS[key].label}</b><i>${METRICS[key].lowerWins ? "低者胜" : "高者胜"}</i></div>
          <div class="v r ${w === 1 ? "wb" : ""}">${fmt(key, rv)}</div>
          <div class="note">${L && R ? note(key, lv, rv) : ""}</div>
        </div>`;
      }).join("")}
    </section>`).join("") + `<p class="fine">示例快照，用来看对比页。成本合计低者更优，其余高者更优。</p>`;
}

function render() { renderPair(); renderBody(); }

function openSheet(side) {
  swapSide = side;
  const used = new Set(slots.filter(Boolean));
  document.getElementById("options").innerHTML = pool.filter(p => !used.has(p.id) || p.id === slots[side]).map(p =>
    `<button class="opt" data-act="choose" data-id="${p.id}"><b>${p.name}</b><span>${p.group} · 销售额 ${money(p.metrics.sales)}</span></button>`
  ).join("") || `<p class="fine">没有可更换的对象了。</p>`;
  document.getElementById("mask").classList.add("show");
}

document.body.addEventListener("click", (ev) => {
  if (ev.target.id === "mask") document.getElementById("mask").classList.remove("show");
  const el = ev.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;
  if (act === "pick") openSheet(Number(el.dataset.side));
  if (act === "choose") {
    slots[swapSide] = el.dataset.id;
    document.getElementById("mask").classList.remove("show");
    render();
  }
  if (act === "close") { slots[Number(el.dataset.side)] = null; render(); }
  if (act === "pin") {
    const side = Number(el.dataset.side);
    if (side === 1 && slots[0] && slots[1]) slots = [slots[1], slots[0]];
    render();
    toast("已钉在左侧");
  }
  if (act === "jump") {
    document.querySelectorAll(".cats button").forEach(b => b.classList.toggle("on", b === el));
    const sec = document.getElementById("sec-" + el.dataset.id);
    if (sec) sec.scrollIntoView({ behavior: "smooth", block: "start" });
  }
});
document.getElementById("back").onclick = () => toast("预览停在对比页");
document.getElementById("copy").onclick = async () => {
  const [l, r] = slots.map(id => id ? find(id).short : "空");
  const wins = tally();
  const text = `灯塔 PK · ${l} ${wins[0]} : ${wins[1]} ${r}`;
  try { await navigator.clipboard.writeText(text); } catch (_) {}
  toast("结论已复制");
};
render();
</script>
</body>
</html>
