name: dunes_app
description: "沙丘 · 统一审批 App — 基于 index.html 原型 100% 还原的 Flutter 壳"
publish_to: 'none'

version: 1.1.9+108

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  http_parser: ^4.1.2
  shared_preferences: ^2.5.3
  file_selector: ^1.1.0
  permission_handler: ^12.0.3
  image_picker: ^1.2.2
  video_player: ^2.10.0
  # Windows 桌面播放需额外实现，否则 VIDEO 气泡无法播。
  video_player_win: ^3.2.0
  # iOS / Android 小视频压缩；桌面端走时长/体积限制。
  video_compress: ^3.1.4
  mime: ^2.0.0
  url_launcher: ^6.3.2
  path_provider: ^2.1.5
  pdfx: ^2.9.2
  centrifuge: ^0.20.0
  flutter_svg: ^2.3.0
  just_audio: ^0.10.5
  # Windows 桌面需要额外实现，否则 IM 语音点击无声。
  just_audio_windows: ^0.2.3
  image: ^4.9.1
  gal: ^2.3.2
  flutter_local_notifications: ^22.0.1
  app_badge_plus: ^1.3.1
  package_info_plus: ^10.2.0
  mobile_scanner: ^7.2.0
  emoji_picker_flutter: ^4.4.0
  pro_image_editor: 11.23.0
  flutter_markdown: ^0.7.7+1
  webview_flutter: ^4.14.1
  window_manager: ^0.5.1
  tray_manager: ^0.5.2
  pasteboard: ^0.5.0
  qr_flutter: ^4.1.0
  desktop_drop: ^0.7.1
  open_filex: ^4.7.0
  # 上游 CMake 目标名/include 路径错误，使用本地修补版。
  just_screenshot:
    path: packages/just_screenshot
  hotkey_manager: ^0.2.3
  webview_flutter_android: 4.12.0
  webview_flutter_wkwebview: ^3.26.0
  geolocator: ^14.0.3
  flutter_inappwebview: 6.2.0-beta.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_logo.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/images/app_logo.png
  web:
    generate: true
    image_path: assets/images/app_logo.png
  windows:
    generate: true
    image_path: assets/images/app_logo.png
  macos:
    generate: true
    image_path: assets/images/app_logo.png

flutter:
  config:
    # TPNS-iOS 仅支持 CocoaPods，必须关闭 SPM 才能正确链接 XGPush
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/images/app_logo.png
    - assets/images/lighthouse_logo.png
    - assets/images/tray_icon.ico
    - assets/images/tray_icon_blank.ico
    - assets/images/tray_icon.png
    - assets/images/tray_icon_blank.png
    - assets/brands/
    - assets/prototype/
    - assets/prototype/dunes_app_ui.js
    - assets/prototype/workbench_live.js
    - assets/prototype/xflow_detail.js
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Regular.ttf
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
    - family: Geist Mono
      fonts:
        - asset: assets/fonts/GeistMono-Regular.ttf
        - asset: assets/fonts/GeistMono-Medium.ttf
          weight: 500
    - family: Noto Sans SC
      fonts:
        - asset: assets/fonts/NotoSansSC-Regular.ttf
        - asset: assets/fonts/NotoSansSC-Medium.ttf
          weight: 500
