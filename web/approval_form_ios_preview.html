<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>填写审批 · iOS 概念稿</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0,#ebe6fb,transparent 42%),#eff1f0;color:#202923;font:14px -apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif}.stage{min-height:100vh;display:flex;justify-content:center;padding:25px 14px}.phone{width:402px;max-width:100%;min-height:850px;background:#f6f7f6;border:7px solid #18211f;border-radius:42px;overflow:hidden;position:relative;box-shadow:0 20px 60px #24352d1a}.screen{min-height:836px;padding-bottom:105px}.status{height:39px;padding:11px 24px 0;display:flex;justify-content:space-between;font-size:12px;font-weight:650}.nav{height:45px;display:flex;align-items:center;justify-content:space-between;padding:0 19px}.back,.more{border:0;background:none;font-size:23px;color:#29352f}.nav-title{font-weight:650;font-size:15px}.main{padding:4px 17px 24px}.switch{display:flex;gap:3px;padding:4px;background:#eae7f3;border-radius:13px;margin:3px 0 15px}.switch button{flex:1;border:0;background:transparent;border-radius:10px;padding:9px 5px;color:#817b90;font:600 11px inherit}.switch button.active{background:#fff;color:#4f3b90;box-shadow:0 2px 7px #30245412}.eyebrow{display:flex;gap:7px;align-items:center;color:#87918b;font-size:10px;font-weight:700;letter-spacing:1.3px;margin:8px 3px}.eyebrow:before{content:"";width:6px;height:6px;border-radius:50%;background:#8064e6}.types{display:flex;gap:7px;overflow:auto;padding:4px 0 11px;scrollbar-width:none}.types::-webkit-scrollbar{display:none}.pill{white-space:nowrap;border:1px solid #e4e0f2;background:#ffffffa8;color:#777286;border-radius:20px;padding:7px 11px;font-size:10px;font-weight:600}.pill.active{background:#7054d8;border-color:#7054d8;color:#fff;box-shadow:0 4px 10px #7054d833}.intro{padding:9px 3px 16px}.kicker{font-size:9px;letter-spacing:1.4px;color:#948da6;font-weight:700}.kicker span{float:right;letter-spacing:.3px}.intro h1{font-size:21px;letter-spacing:-.3px;margin:10px 0 5px}.intro p{font-size:11px;color:#969f99;margin:0}.intro p b,.item label b{color:#d46b6b}.progress{height:3px;background:#e6e2ef;border-radius:3px;margin-top:14px}.progress i{display:block;width:52%;height:100%;border-radius:3px;background:#7054d8}.card{background:white;border:1px solid #edf0ee;border-radius:21px;padding:18px 16px;margin-bottom:12px;box-shadow:0 3px 12px #213c2b05}.sect{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:680;margin-bottom:16px}.mark{width:3px;height:14px;border-radius:3px;background:#7054d8}.hint{margin-left:auto;color:#9b95a7;font-size:9px;font-weight:500}.item{margin-bottom:15px}.item:last-child{margin:0}.item label{display:block;font-size:11px;font-weight:600;margin-bottom:8px;color:#344139}.optional{font-size:9px;color:#a0aaa4;font-weight:400;margin-left:4px}.wrap{position:relative}.input{width:100%;height:43px;border:1px solid #e8ebe9;border-radius:12px;background:#fbfcfb;padding:0 36px 0 12px;color:#36433c;font:12px inherit;outline:none}.input:focus,.textarea:focus{border-color:#b4a5e8;box-shadow:0 0 0 3px #7054d812}.suffix{position:absolute;right:12px;top:14px;color:#9ca69f;font-size:10px}.textarea{width:100%;height:78px;resize:vertical;border:1px solid #e8ebe9;border-radius:12px;background:#fbfcfb;padding:11px 12px;color:#36433c;font:12px inherit;outline:none}.smallhint{font-size:9px;color:#a4ada7;margin-top:6px}.upload{width:100%;height:62px;border:1px dashed #d8d2e9;background:#faf9fd;border-radius:13px;display:flex;align-items:center;gap:10px;padding:0 12px;text-align:left}.plus{height:31px;width:31px;background:#f0edfb;border-radius:10px;color:#7054d8;font-size:20px;display:grid;place-items:center}.upload strong,.approver strong{display:block;font-size:11px;color:#445149}.upload small,.approver small{display:block;color:#a0aaa4;font-size:9px;margin-top:4px}.approver{display:flex;align-items:center;gap:10px}.avatar{width:32px;height:32px;border-radius:50%;background:#eee9fb;color:#7054d8;display:grid;place-items:center;font-size:11px;font-weight:650}.chev{margin-left:auto;color:#a7afa9;font-size:19px}.bottom{position:absolute;bottom:0;left:0;right:0;padding:14px 17px calc(16px + env(safe-area-inset-bottom));background:#ffffffec;backdrop-filter:blur(18px);border-top:1px solid #e9eeeb}.bottomnote{text-align:center;font-size:10px;color:#9aa49f;margin-bottom:11px}.actions{display:grid;grid-template-columns:1fr 1.55fr;gap:10px}.btn{height:47px;border-radius:15px;font:600 14px inherit}.draft{border:1px solid #dfe5e1;background:#fff;color:#53615a}.submit{border:0;color:white;background:linear-gradient(135deg,#8064e6,#6346c3);box-shadow:0 6px 14px #6346c32c}.home{width:115px;height:4px;background:#18211f;border-radius:5px;position:absolute;bottom:6px;left:50%;transform:translateX(-50%)}.toast{position:fixed;left:50%;bottom:25px;transform:translate(-50%,15px);opacity:0;background:#24352e;color:#fff;padding:12px 17px;border-radius:14px;font-size:12px;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:480px){body{background:#f6f7f6}.stage{padding:0}.phone{width:100%;min-height:100vh;border:0;border-radius:0;box-shadow:none}.screen{min-height:100dvh}.home{display:none}}
</style></head><body><div class="stage"><div class="phone"><div class="screen"><div class="status"><span>9:41</span><span>◔　▮▮　▰</span></div><div class="nav"><button class="back" onclick="msg('返回')">‹</button><div class="nav-title">填写申请</div><button class="more" onclick="msg('更多')">•••</button></div><main class="main"><div class="switch"><button class="active">填写表单</button><button onclick="msg('可切换查看审批详情样式')">审批详情</button></div><div class="eyebrow">新建申请 · 填写信息</div><div class="types"><button class="pill active" onclick="selectType(0,this)">采购申请</button><button class="pill" onclick="selectType(1,this)">差旅报销</button><button class="pill" onclick="selectType(2,this)">请假申请</button><button class="pill" onclick="selectType(3,this)">付款申请</button></div><section class="intro"><div class="kicker">APPLICATION FORM <span>01 / 02</span></div><h1 id="title">华东区域柴油采购申请</h1><p>请填写申请信息，带 <b>*</b> 为必填项</p><div class="progress"><i></i></div></section><section class="card"><div class="sect"><i class="mark"></i><span id="sectionTitle">采购信息</span><span class="hint">必填信息</span></div><div id="fields"></div><div class="item"><label>申请说明 <b>*</b></label><textarea class="textarea" id="note" placeholder="请说明申请背景、用途或补充信息"></textarea><div class="smallhint">建议填写相关背景，帮助审批人快速了解申请</div></div><div class="item"><label>相关附件 <span class="optional">选填</span></label><button class="upload" onclick="msg('选择文件')"><span class="plus">＋</span><span><strong>添加附件</strong><small>支持图片、PDF，单个文件不超过 20MB</small></span></button></div></section><section class="card"><div class="sect"><i class="mark"></i>审批人<span class="hint">自动流转</span></div><div class="approver"><span class="avatar">周</span><div><strong>周致远</strong><small>部门负责人 · 华东销售中心</small></div><span class="chev">›</span></div></section></main><div class="bottom"><div class="bottomnote">草稿会自动保存，你可以稍后继续填写</div><div class="actions"><button class="btn draft" onclick="msg('已保存为草稿')">保存草稿</button><button class="btn submit" onclick="msg('申请已提交')">提交申请　↑</button></div></div><div class="home"></div></div></div></div><div class="toast" id="toast"></div>
<script>
const data=[{title:'华东区域柴油采购申请',section:'采购信息',fields:[['采购品种','0# 国VI柴油','⌄'],['计划采购量','1,200','吨'],['含税单价','7,050','元/吨'],['期望交付日期','2026年10月01日','⌄']],note:'为保障国庆期间华东区域客户供应，结合现有库存及近期销售预测，申请提前采购补充库存。'},{title:'北京客户拜访差旅报销',section:'行程与费用',fields:[['出差人员','陈思远','⌄'],['出差地点','北京 · 朝阳区','⌄'],['出差日期','2026年09月21日 — 09月23日','⌄'],['报销金额','3,280.00','元']],note:'拜访华北重点客户并完成季度供应计划沟通，相关票据已上传。'},{title:'国庆前个人休假申请',section:'假期安排',fields:[['假期类型','年假','⌄'],['开始时间','2026年10月01日 09:00','⌄'],['结束时间','2026年10月04日 18:00','⌄'],['工作交接','王晨 · 运营专员','⌄']],note:'计划休年假，已与团队确认值班安排，紧急事项可通过电话联系。'},{title:'华南仓储服务费付款',section:'付款信息',fields:[['收款单位','深圳港联仓储有限公司','⌄'],['付款事由','9 月仓储服务费',''],['付款金额','126,500.00','元'],['计划付款日','2026年09月30日','⌄']],note:'依据仓储服务合同及月度对账单申请付款，费用已由业务部门确认。'}];function selectType(i,b){document.querySelectorAll('.pill').forEach(x=>x.classList.remove('active'));b.classList.add('active');let d=data[i];document.getElementById('title').textContent=d.title;document.getElementById('sectionTitle').textContent=d.section;document.getElementById('note').value=d.note;document.getElementById('fields').innerHTML=d.fields.map((f,j)=>`<div class="item"><label>${f[0]} ${j<3?'<b>*</b>':'<span class="optional">选填</span>'}</label><div class="wrap"><input class="input" value="${f[1]}" placeholder="请输入${f[0]}"/><span class="suffix">${f[2]}</span></div></div>`).join('')}function msg(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600)}selectType(0,document.querySelector('.pill'));
</script></body></html>
