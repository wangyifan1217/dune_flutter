<!DOCTYPE html>
<html lang="zh-CN" spellcheck="false">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="dunes_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="shortcut icon" href="favicon.ico"/>

  <title>dunes_app</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      background: #FBFAF6;
    }

    /* Chrome DOM 拼写/语法黄线；比较表英文/数字特别容易中招 */
    ::spelling-error { text-decoration: none !important; }
    ::grammar-error { text-decoration: none !important; }
    flt-semantics, flt-semantics *, flt-paragraph, flt-span {
      spellcheck: false;
      -webkit-text-decoration: none !important;
      text-decoration: none !important;
    }
  </style>
</head>
<body spellcheck="false">
  <script type="module">
    // Flutter 必须先启动。pdf.js 走 CDN，代理/外网失败时不能挡住整页。
    const boot = import('./flutter_bootstrap.js');
    import('https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/build/pdf.min.mjs')
      .then((pdfjsLib) => {
        globalThis.pdfjsLib = pdfjsLib;
        pdfjsLib.GlobalWorkerOptions.workerSrc =
            'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/build/pdf.worker.mjs';
        globalThis.pdfRenderOptions = {
          cMapUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/cmaps/',
          cMapPacked: true,
        };
      })
      .catch(() => {});
    await boot;
  </script>
</body>
</html>
