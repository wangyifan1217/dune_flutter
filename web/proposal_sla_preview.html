<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>饕 · 提案时效 · 静态预览</title>
  <style>
    :root {
      --bg: #f7f6fa;
      --card: #fff;
      --ink: #261d38;
      --sub: #888196;
      --line: #ede8f5;
      --purple: #7b5cd8;
      --purple-deep: #5b3fb0;
      --blue: #3b6fd8;
      --amber: #b45309;
      --red: #c2414a;
      --green: #1f8a4c;
      --grey: #6b6578;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      background: var(--bg);
      color: var(--ink);
      font-size: 13px;
    }
    button, input, select, textarea { font-family: inherit; }
    .shell { min-height: 100vh; display: flex; }
    .side {
      width: 220px;
      background: #fff;
      border-right: 1px solid var(--line);
      padding: 18px 14px;
      flex: none;
    }
    .brand { display: flex; gap: 10px; align-items: center; margin-bottom: 22px; }
    .mark {
      width: 36px; height: 36px; border-radius: 10px;
      background: linear-gradient(135deg, #8b6be8, #6743d3);
      color: #fff; display: grid; place-items: center; font-weight: 700;
    }
    .brand b { display: block; font-size: 15px; }
    .brand span { color: var(--sub); font-size: 12px; }
    .nav-label { color: var(--sub); font-size: 12px; margin: 8px 8px; }
    .nav-item {
      display: flex; align-items: center; gap: 8px;
      padding: 9px 10px; border-radius: 10px; color: var(--ink); cursor: pointer;
    }
    .nav-item.on { background: #f3eefe; color: var(--purple); font-weight: 700; }
    .main { flex: 1; min-width: 0; padding: 18px 22px 40px; }
    .crumb { color: var(--sub); font-size: 12px; margin-bottom: 8px; }
    .crumb button { border: 0; background: none; color: var(--purple); cursor: pointer; padding: 0; }
    .top { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
    h1 { margin: 0; font-size: 22px; }
    .badge {
      margin-left: auto; color: #9a3412; background: #fff7ed;
      border: 1px solid #fed7aa; border-radius: 999px; padding: 4px 10px; font-size: 12px;
    }
    .lead { color: var(--sub); line-height: 1.6; max-width: 980px; margin: 0 0 14px; }
    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: 16px;
      box-shadow: 0 8px 24px rgba(51, 30, 84, .04);
    }
    .card-h { display: flex; align-items: center; gap: 8px; padding: 14px 16px 0; }
    .bar { width: 4px; height: 16px; border-radius: 2px; background: var(--purple); }
    .card-h b { font-size: 15.5px; }
    .card-h span { color: var(--sub); font-size: 12px; }
    .grid {
      display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px;
      padding: 12px 12px 18px;
    }
    .tile {
      border: 0; background: transparent; border-radius: 12px; padding: 10px 4px 8px;
      cursor: pointer; color: var(--ink);
    }
    .tile:hover { background: #faf8fd; }
    .ico {
      width: 42px; height: 42px; margin: 0 auto 8px; border-radius: 13px;
      display: grid; place-items: center; color: #fff; font-size: 18px;
      box-shadow: 0 6px 12px rgba(91, 63, 176, .18);
    }
    .tile b { display: block; font-size: 13px; }
    .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
    .tabs button {
      border: 0; background: none; padding: 10px 14px; color: var(--sub); cursor: pointer; font-size: 14px;
    }
    .tabs button.on { color: var(--purple); font-weight: 700; box-shadow: inset 0 -2px 0 var(--purple); }
    .filters { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
    input, select, textarea {
      height: 34px; border: 1px solid #e4dfef; border-radius: 8px; padding: 0 10px; background: #fff; color: var(--ink);
    }
    textarea { height: auto; padding: 8px 10px; width: 100%; }
    .btn {
      height: 34px; padding: 0 14px; border-radius: 8px; border: 1px solid #e4dfef;
      background: #fff; cursor: pointer;
    }
    .btn.primary { background: var(--purple); color: #fff; border-color: var(--purple); }
    .btn.link { border: 0; background: none; color: var(--purple); height: auto; padding: 0; }
    .btn:disabled { opacity: .45; cursor: default; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px 10px; text-align: left; border-bottom: 1px solid #f3f0f7; vertical-align: middle; }
    th { color: var(--sub); font-weight: 600; background: #faf9fc; white-space: nowrap; }
    .code { color: var(--sub); margin-left: 6px; font-size: 12px; }
    .tag { display: inline-block; border-radius: 999px; padding: 2px 8px; font-size: 12px; }
    .tag.blue { color: var(--blue); background: #eef3ff; }
    .tag.amber { color: var(--amber); background: #fff7ed; }
    .tag.red { color: var(--red); background: #fff1f2; }
    .tag.green { color: var(--green); background: #ecfdf3; }
    .tag.grey { color: var(--grey); background: #f4f3f6; }
    .pager { display: flex; justify-content: flex-end; gap: 8px; align-items: center; color: var(--sub); padding: 12px 4px 0; }
    .metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
    .metric { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: #fff; }
    .metric span { color: var(--sub); font-size: 12px; }
    .metric b { display: block; font-size: 22px; margin: 4px 0; }
    .metric em { font-style: normal; color: var(--sub); font-size: 12px; }
    .block-title { margin: 16px 0 8px; font-size: 14px; }
    .form { max-width: 640px; display: grid; gap: 12px; }
    .row { display: grid; grid-template-columns: 180px 1fr; align-items: center; gap: 12px; }
    .switch { width: 40px; height: 22px; border-radius: 999px; border: 0; background: #d9d3e6; position: relative; cursor: pointer; }
    .switch.on { background: var(--purple); }
    .switch i { position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: .15s; }
    .switch.on i { left: 20px; }
    .note { background: #fff7ed; color: #9a3412; border-radius: 8px; padding: 10px 12px; }
    .hidden { display: none !important; }
    .mask { position: fixed; inset: 0; background: rgba(38, 29, 56, .35); display: grid; place-items: center; z-index: 5; }
    .dialog { width: 560px; max-width: calc(100vw - 32px); background: #fff; border-radius: 14px; padding: 18px 18px 16px; }
    .dialog h3 { margin: 0 0 12px; font-size: 16px; }
    .dialog .row { grid-template-columns: 88px 1fr; margin-bottom: 10px; }
    .dialog .foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
    .toast {
      position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
      background: #261d38; color: #fff; border-radius: 8px; padding: 8px 14px; display: none;
    }
    @media (max-width: 1100px) {
      .side { display: none; }
      .grid { grid-template-columns: repeat(4, 1fr); }
      .metrics { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="side">
      <div class="brand"><div class="mark">饕</div><div><b>饕</b><span>业务查阅</span></div></div>
      <div class="nav-label">业务查阅</div>
      <div class="nav-item" onclick="showHub()">会议纪要</div>
      <div class="nav-item" onclick="showHub()">任务</div>
      <div class="nav-item" onclick="showHub()">日报</div>
      <div class="nav-item" onclick="showHub()">群响应</div>
      <div class="nav-item" id="nav-sla" onclick="showPage()">提案时效</div>
    </aside>
    <main class="main">
      <section id="hub">
        <div class="top"><h1>饕</h1><div class="badge">静态预览 · 示例数据，不连接口</div></div>
        <p class="lead">PC 宽屏下的业务查阅。提案时效需要组织用户打开「业务查阅-提案时效」后才会出现，这里用静态页先看入口和里面的交互。</p>
        <div class="card">
          <div class="card-h"><i class="bar"></i><b>业务查阅</b><span>任务 · 日报 · 群响应 · 提案时效</span></div>
          <div class="grid" id="hub-grid"></div>
        </div>
      </section>

      <section id="page" class="hidden">
        <div class="crumb"><button onclick="showHub()">饕 / 业务查阅</button> / 提案时效</div>
        <div class="top">
          <h1>提案时效</h1>
          <div class="badge">静态预览 · 可切页签、查询、复核、登记免责</div>
        </div>
        <p class="lead">销售提案进入复核后计时。总时长 72 小时自然时间，退回修改期间暂停。单节点 12 小时，只算 09:00–21:00。超时先生成待复核记录，确认后才计入绩效。</p>
        <div class="tabs" id="tabs"></div>
        <div id="panel"></div>
      </section>
    </main>
  </div>
  <div id="mask" class="mask hidden"></div>
  <div id="toast" class="toast"></div>

  <script>
    const statusMeta = {
      normal: ["正常", "blue"], warning: ["卡点", "amber"], overdue: ["已超时", "red"],
      exempt: ["已免责", "green"], finished: ["已完成", "grey"],
      pending: ["待复核", "amber"], confirmed: ["已确认", "red"], rejected: ["已撤销", "grey"], adjusted: ["已调整", "blue"]
    };
    const kindLabel = { node: "节点超时", leader: "部门负责人连带", total: "总时长超时" };
    const reasonLabel = { system: "系统故障", upstream: "上游资料缺失", force: "不可抗力", special: "领导特批" };

    let cfg = { enabled: true, totalHours: 72, nodeHours: 12, start: "09:00", end: "21:00", warnHours: 2, remindHours: 12, appealDays: 2 };
    let instances = [
      { id: 7, code: "TA-20261013-000260", title: "会员套餐订购-湖北电信", sector: "运营商", status: "normal", round: 1, elapsed: 1.3, total: 72, current: "按驳回意见重新提交·黄永刚", overdueNodes: 0, started: "2026-10-16 08:47", exempt: false },
      { id: 8, code: "TA-20261012-000188", title: "渠道年框续签-华东", sector: "渠道", status: "warning", round: 2, elapsed: 46.5, total: 72, current: "财务整板块复核·陈丽", overdueNodes: 0, started: "2026-10-14 11:20", exempt: false },
      { id: 9, code: "TA-20261009-000141", title: "供给结算调整-油品", sector: "供给", status: "overdue", round: 1, elapsed: 80.2, total: 72, current: "最终确认·周致远", overdueNodes: 2, started: "2026-10-11 09:05", exempt: false },
      { id: 10, code: "TA-20261002-000096", title: "门店巡检方案", sector: "运营", status: "finished", round: 1, elapsed: 38.0, total: 72, current: "—", overdueNodes: 0, started: "2026-10-02 15:12", exempt: false },
      { id: 11, code: "TA-20260928-000077", title: "系统停机窗口申请", sector: "科技", status: "exempt", round: 1, elapsed: 20.0, total: 72, current: "—", overdueNodes: 1, started: "2026-09-28 10:00", exempt: true }
    ];
    let scores = [
      { id: 21, code: "TA-20261009-000141", title: "供给结算调整-油品", kind: "node", node: "最终确认", user: "周致远", source: "", minutes: 310, suggest: 5, final: null, status: "pending", appeal: "", reason: "", reviewer: "", comment: "" },
      { id: 22, code: "TA-20261009-000141", title: "供给结算调整-油品", kind: "leader", node: "最终确认", user: "林嘉宁", source: "周致远", minutes: 310, suggest: 3, final: null, status: "pending", appeal: "pending", reason: "上游对账清单当天未给全", reviewer: "", comment: "" },
      { id: 23, code: "TA-20261012-000188", title: "渠道年框续签-华东", kind: "total", node: "", user: "陈丽", source: "", minutes: 0, suggest: 2, final: 2, status: "confirmed", appeal: "", reason: "", reviewer: "黄永刚", comment: "确认计入" }
    ];
    let tab = "exempt";
    let instStatus = "open";
    let instQ = "";
    let scoreStatus = "pending";
    let scoreQ = "";

    const tiles = [
      ["会议纪要", "#9e43c2", "#7a25a0"],
      ["IM会话", "#4884e8", "#2e63be"],
      ["知识库", "#d67e33", "#b5611b"],
      ["任务", "#2f8f7e", "#1f6f62"],
      ["日报", "#3d7a8c", "#2a5c6b"],
      ["群响应", "#5b6fc4", "#3e529e"],
      ["提案时效", "#c45b7a", "#9e3e5c"],
      ["研发账号", "#4a3e66", "#322849"]
    ];

    function tag(status) {
      const meta = statusMeta[status] || [status || "—", "grey"];
      return `<span class="tag ${meta[1]}">${meta[0]}</span>`;
    }
    function toast(text) {
      const el = document.getElementById("toast");
      el.textContent = text;
      el.style.display = "block";
      clearTimeout(toast._t);
      toast._t = setTimeout(() => { el.style.display = "none"; }, 1800);
    }
    function showHub() {
      document.getElementById("hub").classList.remove("hidden");
      document.getElementById("page").classList.add("hidden");
      document.getElementById("nav-sla").classList.remove("on");
    }
    function showPage() {
      document.getElementById("hub").classList.add("hidden");
      document.getElementById("page").classList.remove("hidden");
      document.getElementById("nav-sla").classList.add("on");
      renderPage();
    }
    function renderHub() {
      document.getElementById("hub-grid").innerHTML = tiles.map(([name, a, b]) => `
        <button class="tile" onclick="${name === "提案时效" ? "showPage()" : `toast('${name} 为既有入口')`}">
          <div class="ico" style="background:linear-gradient(135deg, ${a}, ${b})">◆</div>
          <b>${name}</b>
        </button>`).join("");
    }

    function visibleInstances() {
      return instances.filter((row) => {
        const text = (row.title + row.code).includes(instQ.trim());
        if (!text) return false;
        if (instStatus === "open") return !row.exempt && row.status !== "finished";
        if (!instStatus) return true;
        return row.status === instStatus;
      });
    }
    function visibleScores() {
      return scores.filter((row) => {
        const text = (row.title + row.code + row.user).includes(scoreQ.trim());
        if (!text) return false;
        if (scoreStatus === "appeal") return row.appeal === "pending";
        if (!scoreStatus) return true;
        return row.status === scoreStatus;
      });
    }

    function renderPage() {
      const tabs = [["config", "规则配置"], ["dashboard", "时效看板"], ["scores", "绩效与申诉"], ["exempt", "免责登记"]];
      document.getElementById("tabs").innerHTML = tabs.map(([key, label]) =>
        `<button class="${tab === key ? "on" : ""}" onclick="setTab('${key}')">${label}</button>`).join("");
      const panel = document.getElementById("panel");
      if (tab === "config") panel.innerHTML = renderConfig();
      if (tab === "dashboard") panel.innerHTML = renderDashboard();
      if (tab === "scores") panel.innerHTML = renderScores();
      if (tab === "exempt") panel.innerHTML = renderExempt();
    }
    function setTab(key) { tab = key; renderPage(); }

    function renderConfig() {
      return `<div class="form">
        ${cfg.enabled ? "" : `<div class="note">时限管理未启用。关闭期间不计时、不催办，已在途的记录保留。</div>`}
        <div class="row"><span>启用</span><button class="switch ${cfg.enabled ? "on" : ""}" onclick="cfg.enabled=!cfg.enabled;renderPage()"><i></i></button></div>
        <div class="row"><span>适用范围</span><b>销售提案</b></div>
        ${numRow("总时长（自然时间）", "totalHours", "小时")}
        ${numRow("单节点时限", "nodeHours", "小时")}
        <div class="row"><span>节点计时时段</span><div><input id="start" value="${cfg.start}" style="width:88px"> 至 <input id="end" value="${cfg.end}" style="width:88px"></div></div>
        ${numRow("卡点提醒（剩余）", "warnHours", "小时")}
        ${numRow("超时后催办间隔", "remindHours", "小时")}
        ${numRow("申诉期限", "appealDays", "个工作日")}
        <div><button class="btn primary" onclick="saveConfig()">保存</button></div>
      </div>`;
    }
    function numRow(label, key, unit) {
      return `<div class="row"><span>${label}</span><div><input id="${key}" value="${cfg[key]}" style="width:120px"> ${unit}</div></div>`;
    }
    function saveConfig() {
      ["totalHours", "nodeHours", "warnHours", "remindHours", "appealDays"].forEach((key) => {
        cfg[key] = Number(document.getElementById(key).value) || cfg[key];
      });
      cfg.start = document.getElementById("start").value.trim();
      cfg.end = document.getElementById("end").value.trim();
      toast("已保存");
    }

    function renderDashboard() {
      const open = instances.filter((r) => r.status !== "finished" && !r.exempt);
      const overdue = instances.filter((r) => r.status === "overdue");
      return `<div class="filters"><input value="2026-09-17" readonly style="width:120px"> 至 <input value="2026-10-16" readonly style="width:120px"><button class="btn" onclick="toast('已按示例区间刷新')">刷新</button><span style="color:var(--sub)">按提案进入计时的日期</span></div>
        <div class="metrics">
          <div class="metric"><span>纳入时限</span><b>${instances.length}</b><em>进行中 ${open.length} · 已完成 1</em></div>
          <div class="metric"><span>在途超时</span><b>${overdue.length}</b><em>当前有节点或总时长超时</em></div>
          <div class="metric"><span>平均总用时</span><b>37.2 h</b><em>轮回 1 次</em></div>
          <div class="metric"><span>待复核</span><b>${scores.filter((s) => s.status === "pending").length}</b><em>申诉待处理 ${scores.filter((s) => s.appeal === "pending").length}</em></div>
        </div>
        <div class="block-title">按环节</div>
        ${miniTable(["环节", "节点数", "涉及提案", "超时率"], [["板块复核", 6, 4, "17%"], ["最终审批", 3, 3, "33%"], ["发起填写", 5, 5, "0%"]])}
        <div class="block-title">在途超时提案</div>
        ${instanceTable(overdue, false)}`;
    }
    function miniTable(heads, rows) {
      return `<div class="card" style="overflow:auto"><table><thead><tr>${heads.map((h) => `<th>${h}</th>`).join("")}</tr></thead><tbody>
        ${rows.map((row) => `<tr>${row.map((cell) => `<td>${cell}</td>`).join("")}</tr>`).join("")}
      </tbody></table></div>`;
    }

    function renderExempt() {
      const rows = visibleInstances();
      return `${filterBar("inst", instStatus, instQ, [
        ["open", "进行中"], ["overdue", "已超时"], ["warning", "卡点"], ["finished", "已完成"], ["exempt", "已免责"], ["", "全部"]
      ], "搜索提案编号 / 名称")}
      ${instanceTable(rows, true)}
      <div class="pager">显示第 1 条-第 ${rows.length} 条，共 ${rows.length} 条 <button class="btn" disabled>‹</button> <b>1</b> <button class="btn" disabled>›</button></div>`;
    }
    function filterBar(kind, status, q, options, placeholder) {
      return `<div class="filters">
        <select onchange="onFilter('${kind}', this.value)">${options.map(([v, l]) => `<option value="${v}" ${v === status ? "selected" : ""}>${l}</option>`).join("")}</select>
        <input id="q-${kind}" value="${escapeAttr(q)}" placeholder="${placeholder}" style="width:280px" onkeydown="if(event.key==='Enter') query('${kind}')">
        <button class="btn primary" onclick="query('${kind}')">查询</button>
      </div>`;
    }
    function onFilter(kind, value) {
      if (kind === "inst") instStatus = value; else scoreStatus = value;
      renderPage();
    }
    function query(kind) {
      const value = document.getElementById("q-" + kind).value;
      if (kind === "inst") instQ = value; else scoreQ = value;
      renderPage();
    }
    function instanceTable(rows, withAction) {
      return `<div class="card" style="overflow:auto"><table><thead><tr>
        <th>提案</th><th>板块</th><th>状态</th><th>轮回</th><th>总用时</th><th>当前节点</th><th>超时节点</th><th>开始</th>${withAction ? "<th>操作</th>" : ""}
      </tr></thead><tbody>
        ${rows.map((row) => `<tr>
          <td>${row.title}<span class="code">${row.code}</span></td>
          <td>${row.sector}</td><td>${tag(row.status)}</td><td>${Math.max(0, row.round - 1)}</td>
          <td>${row.elapsed} / ${row.total} h</td><td>${row.current}</td><td>${row.overdueNodes}</td><td>${row.started}</td>
          ${withAction ? `<td>${row.exempt ? "—" : `<button class="btn link" onclick="openExempt(${row.id})">登记免责</button>`}</td>` : ""}
        </tr>`).join("") || `<tr><td colspan="9" style="color:var(--sub)">没有符合条件的记录</td></tr>`}
      </tbody></table></div>`;
    }

    function renderScores() {
      const rows = visibleScores();
      return `${filterBar("score", scoreStatus, scoreQ, [
        ["pending", "待复核"], ["appeal", "申诉中"], ["confirmed", "已确认"], ["adjusted", "已调整"], ["rejected", "已撤销"], ["exempt", "已免责"], ["", "全部"]
      ], "搜索提案编号 / 名称 / 责任人")}
      <div class="card" style="overflow:auto"><table><thead><tr>
        <th>提案</th><th>类型</th><th>责任人</th><th>超时</th><th>分数</th><th>状态</th><th>申诉</th><th>操作</th>
      </tr></thead><tbody>
        ${rows.map((row) => `<tr>
          <td>${row.title}<span class="code">${row.code}</span></td>
          <td>${kindLabel[row.kind] || row.kind}${row.node ? " · " + row.node : ""}</td>
          <td>${row.source ? row.user + "（因 " + row.source + "）" : row.user}</td>
          <td>${row.minutes ? Math.floor(row.minutes / 60) + " 小时 " + (row.minutes % 60) + " 分" : "—"}</td>
          <td>${row.final != null && row.status !== "pending" ? row.final + " 分" : "建议 " + row.suggest + " 分"}</td>
          <td>${tag(row.status)}</td>
          <td>${row.appeal === "pending" ? tag("pending").replace("待复核", "申诉中") + " " + row.reason : "—"}</td>
          <td><button class="btn link" onclick="openReview(${row.id})">复核</button></td>
        </tr>`).join("") || `<tr><td colspan="8" style="color:var(--sub)">没有符合条件的记录</td></tr>`}
      </tbody></table></div>`;
    }

    function openExempt(id) {
      const row = instances.find((item) => item.id === id);
      openDialog(`登记免责 · ${row.title}`, `
        <div class="row"><span>免责范围</span><select id="ex-node"><option value="0">整张提案（全部节点）</option><option value="1">最终确认 · 周致远 · 进行中 · 超时</option></select></div>
        <div class="row"><span>免责原因</span><select id="ex-reason">${Object.entries(reasonLabel).map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}</select></div>
        <div class="row"><span>说明</span><textarea id="ex-text" rows="3" placeholder="请填写免责说明"></textarea></div>
        <div style="color:var(--sub);font-size:12px">登记后该范围内待复核的扣分记录改为「已免责」，节点不再催办。</div>
      `, () => {
        const text = document.getElementById("ex-text").value.trim();
        if (!text) { toast("请填写免责说明"); return false; }
        row.exempt = true;
        row.status = "exempt";
        scores.forEach((item) => {
          if (item.code === row.code && item.status === "pending") item.status = "exempt";
        });
        toast("已登记免责");
        return true;
      });
    }
    function openReview(id) {
      const row = scores.find((item) => item.id === id);
      openDialog(`复核 · ${row.user} · ${kindLabel[row.kind]}`, `
        ${row.appeal === "pending" ? `<div class="note" style="margin-bottom:10px">申诉理由：${row.reason}</div>` : ""}
        <div class="row"><span>处理</span><select id="rv-action">
          <option value="confirm">确认扣分（${row.suggest} 分）</option>
          <option value="adjust">调整分数</option>
          <option value="reject">撤销（不扣分）</option>
          <option value="exempt">免责</option>
        </select></div>
        <div class="row" id="rv-points-row" style="display:none"><span>调整后分数</span><input id="rv-points" value="${row.suggest}"></div>
        <div class="row"><span>复核意见</span><textarea id="rv-text" rows="3"></textarea></div>
      `, () => {
        const action = document.getElementById("rv-action").value;
        const text = document.getElementById("rv-text").value.trim();
        if (action !== "confirm" && !text) { toast("请填写复核意见"); return false; }
        row.status = action === "confirm" ? "confirmed" : action === "adjust" ? "adjusted" : action === "reject" ? "rejected" : "exempt";
        row.final = action === "adjust" ? Number(document.getElementById("rv-points").value) || row.suggest : action === "confirm" ? row.suggest : 0;
        row.reviewer = "系统管理员";
        row.comment = text;
        if (row.appeal === "pending") row.appeal = action === "reject" || action === "exempt" ? "approved" : "rejected";
        toast("已复核");
        return true;
      });
      const action = document.getElementById("rv-action");
      action.onchange = () => {
        document.getElementById("rv-points-row").style.display = action.value === "adjust" ? "grid" : "none";
      };
    }
    function openDialog(title, body, onOk) {
      const mask = document.getElementById("mask");
      mask.classList.remove("hidden");
      mask.innerHTML = `<div class="dialog"><h3>${title}</h3>${body}<div class="foot"><button class="btn" onclick="closeDialog()">取消</button><button class="btn primary" id="dlg-ok">确定</button></div></div>`;
      document.getElementById("dlg-ok").onclick = () => { if (onOk() !== false) closeDialog(); };
    }
    function closeDialog() {
      document.getElementById("mask").classList.add("hidden");
      renderPage();
    }
    function escapeAttr(value) { return String(value).replace(/"/g, "&quot;"); }

    renderHub();
    showPage();
  </script>
</body>
</html>
