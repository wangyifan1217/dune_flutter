<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>一周小结</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f5f7;
      --card: #ffffff;
      --ink: #1d1d1f;
      --secondary: #86868b;
      --line: rgba(0, 0, 0, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .page {
      max-width: 430px;
      margin: 0 auto;
      padding: 28px 16px 48px;
    }
    .card {
      background: var(--card);
      border-radius: 22px;
      padding: 22px 20px 18px;
    }
    .head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }
    h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 650;
      letter-spacing: -0.03em;
    }
    .range {
      font-size: 15px;
      color: var(--secondary);
      font-variant-numeric: tabular-nums;
    }
    .section { margin-top: 22px; padding-top: 18px; border-top: 0.5px solid var(--line); }
    .section-title {
      margin: 0 0 14px;
      font-size: 13px;
      font-weight: 600;
      color: var(--secondary);
    }
    .metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .metrics.two { grid-template-columns: repeat(2, 1fr); max-width: 68%; }
    .metric-value {
      font-size: 32px;
      font-weight: 620;
      letter-spacing: -0.04em;
      font-variant-numeric: tabular-nums;
      line-height: 1.05;
    }
    .metric-label {
      margin-top: 4px;
      font-size: 13px;
      color: var(--secondary);
    }
    .note {
      margin: 14px 0 0;
      font-size: 15px;
      color: var(--secondary);
    }
    .rows { display: flex; flex-direction: column; }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 11px 0;
      border-top: 0.5px solid var(--line);
      font-size: 17px;
    }
    .row:first-child { border-top: 0; padding-top: 0; }
    .row span:last-child {
      font-variant-numeric: tabular-nums;
      font-weight: 590;
    }
    .route {
      margin: 14px 0 0;
      font-size: 15px;
      color: var(--ink);
    }
    .quote {
      margin: 22px 0 0;
      font-size: 13px;
      line-height: 1.45;
      color: var(--secondary);
    }
  </style>
</head>
<body>
  <main class="page">
    <article class="card">
      <header class="head">
        <h1>一周小结</h1>
        <div class="range">9.22–9.26</div>
      </header>

      <section class="section">
        <h2 class="section-title">沟通</h2>
        <div class="metrics">
          <div>
            <div class="metric-value">22</div>
            <div class="metric-label">工作会话</div>
          </div>
          <div>
            <div class="metric-value">186</div>
            <div class="metric-label">消息</div>
          </div>
          <div>
            <div class="metric-value">94</div>
            <div class="metric-label">分钟</div>
          </div>
        </div>
        <p class="note">最晚在周四晚上 23:41</p>
      </section>

      <section class="section">
        <h2 class="section-title">会议</h2>
        <div class="metrics two">
          <div>
            <div class="metric-value">3</div>
            <div class="metric-label">场次</div>
          </div>
          <div>
            <div class="metric-value">18</div>
            <div class="metric-label">参会人数</div>
          </div>
        </div>
      </section>

      <section class="section">
        <h2 class="section-title">画像</h2>
        <div class="rows">
          <div class="row"><span>已完成任务</span><span>4</span></div>
          <div class="row"><span>发起提案</span><span>1</span></div>
          <div class="row"><span>会议纪要</span><span>2</span></div>
        </div>
      </section>

      <section class="section">
        <h2 class="section-title">差旅</h2>
        <div class="metrics">
          <div>
            <div class="metric-value">3</div>
            <div class="metric-label">天</div>
          </div>
          <div>
            <div class="metric-value">2,140</div>
            <div class="metric-label">飞行约公里</div>
          </div>
          <div>
            <div class="metric-value">1,086</div>
            <div class="metric-label">高铁约公里</div>
          </div>
        </div>
        <p class="route">上海 → 北京 → 上海</p>
      </section>

      <p class="quote">将小事做到极致，是做大事业的第一步</p>
    </article>
  </main>
</body>
</html>
