<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>一周小结</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1d1d1f;
      --sub: #3a3a3c;
      --secondary: #8e8e93;
      --dot: #c7c7cc;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      background:
        radial-gradient(900px 420px at 12% -8%, rgba(255, 255, 255, 0.95), transparent 55%),
        radial-gradient(720px 380px at 100% 0%, rgba(214, 206, 232, 0.85), transparent 46%),
        linear-gradient(180deg, #eceaf2 0%, #f7f6f9 42%, #e7e4ee 100%);
    }
    .page {
      max-width: 320px;
      margin: 0 auto;
      padding: 28px 16px 48px;
    }
    .card {
      border-radius: 18px;
      padding: 12px 12px 10px;
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.95);
      box-shadow:
        0 10px 28px rgba(48, 35, 95, 0.08),
        0 1px 2px rgba(48, 35, 95, 0.04);
      backdrop-filter: blur(18px);
    }
    .head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
    }
    h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 650;
      letter-spacing: -0.02em;
    }
    .range {
      font-size: 11px;
      font-weight: 500;
      color: var(--secondary);
      font-variant-numeric: tabular-nums;
    }
    .metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      margin-top: 9px;
    }
    .metric {
      display: flex;
      align-items: baseline;
      gap: 3px;
      min-width: 0;
    }
    .metric b {
      font-size: 18px;
      font-weight: 650;
      letter-spacing: -0.04em;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    .metric span {
      font-size: 11px;
      font-weight: 500;
      color: var(--secondary);
      line-height: 1;
    }
    .note {
      margin: 5px 0 0;
      font-size: 11px;
      line-height: 1.2;
      color: var(--secondary);
    }
    .sheet {
      margin-top: 8px;
      padding: 6px 8px 5px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.035);
    }
    .row {
      display: grid;
      grid-template-columns: 28px 1fr;
      column-gap: 8px;
      align-items: start;
      padding: 2px 0;
      font-size: 12px;
      line-height: 1.35;
    }
    .k {
      padding-top: 1px;
      font-size: 11px;
      font-weight: 500;
      color: var(--secondary);
    }
    .v b {
      font-weight: 650;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
    }
    .v span,
    .cap {
      font-weight: 500;
      color: var(--sub);
    }
    .v em {
      font-style: normal;
      font-weight: 500;
      color: #aeaeb2;
      padding: 0 4px;
    }
    .cap {
      margin-top: 1px;
      font-size: 11px;
      line-height: 1.3;
      color: var(--secondary);
    }
  </style>
</head>
<body>
  <main class="page">
    <article class="card">
      <header class="head">
        <h1>一周小结</h1>
        <div class="range">9.22–9.26</div>
      </header>

      <div class="metrics">
        <div class="metric"><b>22</b><span>会话</span></div>
        <div class="metric"><b>186</b><span>消息</span></div>
        <div class="metric"><b>94</b><span>分钟</span></div>
      </div>
      <p class="note">最晚周四晚上 23:41</p>

      <div class="sheet">
        <div class="row">
          <div class="k">会议</div>
          <div class="v"><b>3</b><span> 场</span><em>·</em><b>18</b><span> 人</span></div>
        </div>
        <div class="row">
          <div class="k">本周</div>
          <div class="v"><b>4</b><span> 项任务</span><em>·</em><b>1</b><span> 提案</span><em>·</em><b>2</b><span> 纪要</span></div>
        </div>
        <div class="row">
          <div class="k">差旅</div>
          <div>
            <div class="v"><b>3</b><span> 天</span><em>·</em><span>上海 → 北京 → 上海</span></div>
            <div class="cap">飞行约 2,140 公里 · 高铁约 1,086 公里</div>
          </div>
        </div>
      </div>
    </article>
  </main>
</body>
</html>
